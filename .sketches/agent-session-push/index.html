<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="比较 MCP Events、ACP、Codex App Server 与 hook 唤醒的离线研究图谱。">
<title>消息如何叫醒 Agent · AgentX 研究</title>
<style>
:root{color-scheme:light;--paper:#f8faf8;--surface:#fff;--ink:#182420;--muted:#52645d;--rule:#d0dcd6;--accent:#10614c;--soft:#e6f3ec;--focus:#10614c;--s1:.375rem;--s2:.625rem;--s3:1rem;--s4:1.5rem;--s5:2.5rem;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 system-ui,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}
main{max-width:1272px;margin:auto;padding:var(--s4) clamp(1rem,4vw,3.25rem) var(--s5)}
a{color:var(--accent);text-underline-offset:.23em}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
nav,.controls,.legend{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
nav{justify-content:space-between;color:var(--muted);font-size:.82rem}
h1{font-size:clamp(2rem,4vw,3.2rem);line-height:1.12;letter-spacing:-.04em;margin:var(--s4) 0 .5rem}
header p{margin:0;color:var(--muted);font-size:clamp(.9rem,2vw,1.06rem)}
.controls{margin:var(--s4) 0 .85rem;justify-content:space-between}
.switch{display:flex;align-items:center;gap:.3rem;padding:3px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.switch button{border:0;background:transparent;padding:.32rem .85rem;border-radius:5px;min-height:2.25rem;white-space:nowrap}
.switch button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:650}
.legend{font-size:.79rem;color:var(--muted);gap:.65rem}
.legend em{font-style:normal;display:inline-block;width:1.2rem;border-top:2px dashed var(--accent);vertical-align:middle;margin-right:.35rem}
.board{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.board-head,.lane{display:grid;grid-template-columns:1.03fr repeat(4,minmax(0,1fr))}
.board-head{font-size:.78rem;color:var(--muted);background:#eff4f1;font-weight:650}
.board-head span{padding:.64rem .85rem}
.board-head small{color:var(--accent);font-size:.69rem;margin-left:.5rem}
.lane{border-top:1px solid var(--rule);position:relative}
.lane[aria-current="true"]{background:#f1f8f4}
.lane-name{background:none;border:0;text-align:left;padding:.72rem .85rem;min-width:0;line-height:1.3;border-left:3px solid transparent}
.lane[aria-current="true"] .lane-name{border-left-color:var(--accent);color:var(--accent)}
.lane-name:hover{background:var(--soft)}
.lane-name b{display:block;font-size:.98rem}
.lane-name small{display:block;font-size:.74rem;color:var(--muted);margin-top:.25rem}
.cell{min-width:0;padding:.72rem .85rem;border-left:1px solid #e8efeb;position:relative}
.cell b,.cell small{display:block;overflow-wrap:anywhere}
.cell b{font-size:.9rem;line-height:1.35}
.cell small{font-size:.74rem;color:var(--muted);margin-top:.23rem;line-height:1.45}
.handoff{border-left:2px dashed #6aab94}
.lane[aria-current="true"] .handoff{background:var(--soft)}
.cell[data-tone="stop"] b::before{content:"⊣ ";color:var(--accent)}
.cell[data-tone="go"] b::before{content:"→ ";color:var(--accent)}
.cell[data-tone="wait"] b::before{content:"⋯ ";color:var(--accent)}
.detail{display:grid;grid-template-columns:minmax(12rem,.75fr) minmax(0,2fr);gap:var(--s4);padding:var(--s3) 0;margin-top:.48rem;border-bottom:1px solid var(--rule)}
.eyebrow{color:var(--accent);font:650 .75rem/1.4 var(--mono)}
.detail h2{font-size:1.11rem;line-height:1.35;margin:.25rem 0}
.detail p{margin:0 0 .35rem;max-width:72ch}
.detail a,.footer a{font-size:.85rem}
.footer{display:flex;flex-wrap:wrap;gap:.5rem 1.15rem;margin-top:.9rem}
@media(max-width:740px){
 main{padding-top:var(--s3)}
 .board{background:none;border:0;border-radius:0}
 .board-head{display:none}
 .lane{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:.65rem;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--surface)}
 .lane-name{grid-column:1/-1;border-bottom:1px solid var(--rule)}
 .lane-name small{display:inline;margin-left:.5rem}
 .lane-name b{display:inline}
 .cell{border-top:1px solid var(--rule);padding:.55rem .72rem}
 .cell::before{content:attr(data-stage);display:block;color:var(--muted);font-size:.69rem;font-weight:650;margin-bottom:.22rem}
 .cell.handoff{border-left:0;border-top:2px dashed #6aab94}
 .cell:last-child{border-top:2px solid var(--rule)}
 .detail{grid-template-columns:1fr;gap:.35rem}
}
</style>
</head>
<body>
<main>
<nav aria-label="研究导航"><span>AgentX · 会话投递研究 / 2026-11-22</span><a href="README.md">打开研究目录 ↗</a></nav>
<header><h1>消息如何叫醒 Agent</h1><p>同一封信，四条路径。虚线左侧把事件送到宿主；右侧决定哪条会话执行。</p></header>
<div class="controls"><div class="switch" role="group" aria-label="目标会话状态">
<button type="button" data-state="idle" aria-pressed="true">会话空闲</button><button type="button" data-state="busy" aria-pressed="false">会话忙碌</button><button type="button" data-state="offline" aria-pressed="false">连接断开</button>
</div><div class="legend"><span><em></em>宿主接手</span><span>→ 执行</span><span>⋯ 等待</span><span>⊣ 到此为止</span></div></div>
<section class="board" aria-label="消息路径对比">
<div class="board-head" aria-hidden="true"><span>投递路线</span><span>01 · 发送</span><span>02 · 接收</span><span class="handoff">03 · 控制会话</span><span>04 · 模型轮次</span></div>
<div id="lanes"></div>
</section>
<section class="detail" id="route-detail" aria-live="polite" aria-labelledby="detail-title">
<div><span id="detail-tag" class="eyebrow"></span><h2 id="detail-title"></h2></div>
<div><p id="detail-body"></p><a id="detail-link"></a></div>
</section>
<footer class="footer" aria-label="研究材料">
<a href="mcp.md">MCP 与子进程</a><a href="acp.md">ACP 定义、发现与协议</a><a href="options.md">方案比较与 Codex fork</a><a href="evidence.md">实验证据与复跑</a>
</footer>
<noscript>图谱需要本地 JavaScript。可直接打开<a href="README.md">中文研究目录</a>查看所有材料。</noscript>
</main>
<script>
"use strict";
const routes = [
  {
    key:"hook", title:"Hook 拉取", basis:"兼容路径", tag:"当前机制 · 引用既有记录",
    detail:"待收消息由合适的 hook 读取",
    note:"没有宿主回调时，就没有这次拉取。通过终端按键促成提示词或 hook 是一种兼容唤醒；当前 AgentX 的实际投递与恢复边界见既有记录。",
    href:"options.md", link:"查看兼容路径与原投递记录",
    fixed:[["AgentX 入库","等宿主出现回调"],["Hook","触发时读取收件箱"],["宿主继续原流程","依触发位置处理输入"]],
    outcome:{idle:["等待触发","空闲本身不会调用 hook","wait"],busy:["等待回调","运行到相关 hook 才会拉取","wait"],offline:["入库保留","重连后等下一次可用入口","wait"]}
  },
  {
    key:"mcp", title:"MCP 事件", basis:"标准传输 · Beta", tag:"官方规范 + Codex 隔离反例",
    detail:"发送到 MCP 客户端，并未跨入轮次",
    note:"官方 Events 要先订阅，再选择推送、webhook 或轮询。隔离实验中一条实际 stdio 连接服务两个 Codex 线程；探针通知没有引起模型请求。这里的停止符表示单靠 MCP 传输无法完成唤醒。",
    href:"mcp.md", link:"查看进程拓扑与事件规范",
    fixed:[["事件源","AgentX 或外部服务"],["MCP 客户端","Events 订阅收到事件"],["宿主接手","需另一个会话控制入口"]],
    outcome:{idle:["仅收到事件","默认不会开始一轮","stop"],busy:["由宿主决定","MCP 不规定忙时处理","stop"],offline:["按游标补收","须有可回放历史；仍需宿主","wait"]}
  },
  {
    key:"acp", title:"ACP 托管", basis:"Codex + OpenCode 实测", tag:"隔离实测 · ACP v1",
    detail:"向指定的会话 ID 发一轮",
    note:"同一个客户端在两种 Agent 的隔离实验中，能唤醒空闲原会话；忙时由客户端排队，干净重启后加载原会话。不能假定任意原生终端可接管。Codex 的 v2 Preview 另已验证提前回执与同键重试。",
    href:"evidence.md#acp-v1", link:"查看双工具实测与边界",
    fixed:[["AgentX 入库","按消息 ID 认领"],["AgentX 常驻宿主","绑定参与者与 session ID"],["session/prompt","通过 ACP 向原会话提交"]],
    outcome:{idle:["原会话继续","不用 hook 或按键","go"],busy:["等当前轮结束","v1 由客户端按会话排队","wait"],offline:["加载并核对","响应丢失时先核对，避免重发","wait"]}
  },
  {
    key:"native", title:"Codex 原生", basis:"App Server · 同线程", tag:"隔离实测 + 既有原生接入",
    detail:"用原生轮次接口控制正确线程",
    note:"App Server 按 threadId 开始新轮；已知道活跃轮次时可用带 expectedTurnId 的 turn/steer 指向它。未托管的原生终端另议；源码可改，但这一条现有路径不需要 fork。",
    href:"options.md#codex-是开源的改哪里才有用", link:"查看原生接入和 fork 比较",
    fixed:[["AgentX 入库","保留原有消息身份"],["Codex 适配层","解析 threadId 与运行代次"],["turn/start · turn/steer","原生 App Server"]],
    outcome:{idle:["同一线程开轮","已用环回模型夹具验证","go"],busy:["等待或追加输入","追加需匹配活动轮次","go"],offline:["恢复原线程","核对输入是否已经记录","wait"]}
  }
];
const stages=["01 · 发送","02 · 接收","03 · 控制会话","04 · 模型轮次"];
const rows = new Map();
const controls = [...document.querySelectorAll("[data-state]")];
let state = "idle";
let selected = "acp";
function node(tag, value, css) {
  const el=document.createElement(tag);
  if(value) el.textContent=value;
  if(css) el.className=css;
  return el;
}
function routeRow(route) {
  const row=node("article",null,"lane");
  row.dataset.route=route.key;
  const button=node("button",null,"lane-name");
  button.type="button";
  button.setAttribute("aria-controls","route-detail");
  button.append(node("b",route.title),node("small",route.basis));
  button.addEventListener("click",()=>{ selected=route.key; render(); });
  row.append(button);
  const cells=stages.map((stage,i)=>{
    const cell=node("div",null,i===2?"cell handoff":"cell");
    cell.dataset.stage=stage;
    cell.append(node("b"),node("small"));
    row.append(cell);
    return cell;
  });
  rows.set(route.key,{row,button,cells});
  return row;
}
function render() {
  controls.forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.state===state)));
  for(const route of routes){
    const {row,button,cells}=rows.get(route.key);
    row.setAttribute("aria-current",String(route.key===selected));
    button.setAttribute("aria-pressed",String(route.key===selected));
    [...route.fixed,route.outcome[state]].forEach(([label,hint,tone],i)=>{
      cells[i].children[0].textContent=label;
      cells[i].children[1].textContent=hint;
      cells[i].dataset.tone=tone||"";
    });
  }
  const route=routes.find(r=>r.key===selected);
  document.getElementById("detail-tag").textContent=route.tag;
  document.getElementById("detail-title").textContent=route.detail;
  document.getElementById("detail-body").textContent=route.note;
  const link=document.getElementById("detail-link");
  link.textContent=route.link;
  link.href=route.href;
}
document.getElementById("lanes").append(...routes.map(routeRow));
controls.forEach(button=>button.addEventListener("click",()=>{ state=button.dataset.state; render(); }));
render();
</script>
</body>
</html>
