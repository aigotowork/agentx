<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Native TUI replay</title>
<style>
:root {
    color-scheme: dark;
    --workspace: #1a1b24;
    --rail: #20222e;
    --terminal: #11121b;
    --ink: #e6e9f7;
    --muted: #a8aec4;
    --line: #424658;
    --highlight: #f2c780;
    --terminal-fg: #c0caf5;
    --terminal-font: "DejaVu Sans Mono", ui-monospace, monospace;
    --cell-w: 8.43px;
    --cell-h: 19px;
    --glyph-size: 14px;
    --hairline: 1px;
    --mark-width: 2px;
    --unit: 4px;
    --radius: 6px;
    --rail-width: 17rem;
    --shell-width: 84rem;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--workspace); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
.wrap { max-width: var(--shell-width); margin-inline: auto; padding: calc(5 * var(--unit)); }
header { display: flex; gap: calc(4 * var(--unit)); align-items: baseline; flex-wrap: wrap; margin-block-end: calc(4 * var(--unit)); }
h1, h2, p { margin: 0; }
h1 { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
.subtitle, .step-count, .step-number, dt { color: var(--muted); }
.workspace { display: grid; grid-template-columns: var(--rail-width) minmax(0, 1fr); align-items: start; gap: calc(4 * var(--unit)); }
.step-rail { background: var(--rail); border: var(--hairline) solid var(--line); border-radius: var(--radius); }
.rail-caption { padding: calc(2 * var(--unit)) calc(3 * var(--unit)); border-block-end: var(--hairline) solid var(--line); font-size: 13px; }
.step-list { margin: 0; padding: var(--unit); list-style: none; max-height: 70vh; overflow: auto; }
button { color: inherit; background: var(--rail); border: var(--hairline) solid var(--line); padding: var(--unit) calc(2 * var(--unit)); border-radius: var(--radius); font: inherit; cursor: pointer; }
button:disabled { opacity: .48; cursor: default; }
button:enabled:hover { border-color: var(--muted); }
button:focus-visible { outline: var(--mark-width) solid var(--highlight); outline-offset: var(--hairline); }
.terminal-scroll:focus-visible { outline: var(--mark-width) solid var(--highlight); outline-offset: calc(-1 * var(--mark-width)); }
.step-button { width: 100%; display: flex; gap: calc(2 * var(--unit)); text-align: start; align-items: baseline; background: transparent; border-color: transparent; }
.step-button[aria-current="step"], .phase-button[aria-pressed="true"] { color: var(--highlight); border-color: currentColor; }
.step-number, .step-count, .frame-size { font-family: var(--terminal-font); font-variant-numeric: tabular-nums; }
.transport { display: flex; flex-wrap: wrap; align-items: center; gap: calc(2 * var(--unit)); margin-block-end: calc(3 * var(--unit)); }
.transport-group { display: flex; align-items: center; gap: var(--unit); }
.phase { margin-inline-start: auto; }
.stage { min-width: 0; }
.frame-shell { border: var(--hairline) solid var(--line); border-radius: var(--radius); background: var(--terminal); }
.frame-heading { display: flex; align-items: baseline; justify-content: space-between; gap: calc(3 * var(--unit)); padding: calc(2 * var(--unit)) calc(3 * var(--unit)); color: var(--muted); border-block-end: var(--hairline) solid var(--line); }
.frame-heading h2 { font-size: 14px; font-weight: 600; color: var(--ink); }
.frame-size { font-size: 12px; white-space: nowrap; }
.terminal-scroll { overflow: auto; padding: calc(3 * var(--unit)); }
.terminal {
    position: relative;
    width: calc(var(--columns) * var(--cell-w));
    height: calc(var(--lines) * var(--cell-h));
    color: var(--terminal-fg);
    font: var(--glyph-size)/var(--cell-h) var(--terminal-font);
    font-variant-ligatures: none;
    overflow: hidden;
}
.terminal-row { height: var(--cell-h); white-space: pre; }
.run {
    display: inline-block;
    vertical-align: top;
    width: calc(var(--columns) * var(--cell-w));
    color: var(--fg, var(--terminal-fg));
    background: var(--bg, var(--terminal));
}
.run[data-bold] { font-weight: bold; }
.run[data-dim] { color: color-mix(in srgb, var(--fg, var(--terminal-fg)) 65%, var(--bg, var(--terminal))); }
.run[data-italic] { font-style: italic; }
.run[data-underline] { text-decoration: underline; }
.run[data-strike] { text-decoration: line-through; }
.run[data-underline][data-strike] { text-decoration: underline line-through; }
.run[data-hidden] { color: transparent; }
.cell-overlay {
    pointer-events: none;
    position: absolute;
    left: calc(var(--x) * var(--cell-w));
    top: calc(var(--y) * var(--cell-h));
    width: calc(var(--width, 1) * var(--cell-w));
    height: calc(var(--height, 1) * var(--cell-h));
}
.hit-region { border: var(--hairline) dashed var(--highlight); }
.pointer { box-shadow: inset 0 0 0 var(--mark-width) var(--highlight); background: color-mix(in srgb, var(--highlight) 33%, transparent); }
.text-cursor { border-inline-start: var(--mark-width) solid var(--terminal-fg); }
.metadata { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--unit) calc(3 * var(--unit)); margin: 0; padding: calc(2 * var(--unit)) calc(3 * var(--unit)); border-block-start: var(--hairline) solid var(--line); font-size: 13px; }
dd { margin: 0; overflow-wrap: anywhere; }
small { color: var(--muted); }
@media (max-width: 720px) {
    .wrap { padding: calc(3 * var(--unit)); }
    .workspace { grid-template-columns: minmax(0, 1fr); }
    .step-rail { grid-row: 2; }
    .step-list { max-height: 12rem; }
}
</style>
</head>
<body>
<div class="wrap">
    <header><h1>Native TUI replay</h1><p class="subtitle" id="scenario"></p></header>
    <main class="workspace">
        <nav class="step-rail" aria-labelledby="steps-label">
            <h2 class="rail-caption" id="steps-label">Steps</h2>
            <ol class="step-list" id="steps"></ol>
        </nav>
        <section class="stage" aria-label="Selected step">
            <div class="transport">
                <div class="transport-group" aria-label="Navigate steps">
                    <button id="prev" type="button" title="Previous step (Left arrow)">Previous</button>
                    <button id="next" type="button" title="Next step (Right arrow)">Next</button>
                    <span class="step-count" id="step-count"></span>
                </div>
                <div class="transport-group phase" aria-label="Frame timing">
                    <button class="phase-button" id="before" type="button">Before input</button>
                    <button class="phase-button" id="after" type="button">After input</button>
                </div>
            </div>
            <article class="frame-shell" aria-labelledby="step-title">
                <div class="frame-heading" aria-live="polite">
                    <h2 id="step-title"></h2><span class="frame-size" id="frame-size"></span>
                </div>
                <div class="terminal-scroll" tabindex="0" role="region" aria-label="Terminal frame"><div class="terminal" id="terminal"></div></div>
                <dl class="metadata" id="metadata"></dl>
            </article>
        </section>
    </main>
</div>
<script id="trace" type="application/json">__TRACE_JSON__</script>
<script>
const trace = JSON.parse(document.getElementById("trace").textContent);
const byId = (id) => document.getElementById(id);
const terminal = byId("terminal");
const list = byId("steps");
const metadata = byId("metadata");
const pad = (index) => String(index).padStart(2, "0");
const ansi = ["#000", "#cd0000", "#00cd00", "#cdcd00", "#0000ee", "#cd00cd", "#00cdcd", "#e5e5e5",
              "#7f7f7f", "#f00", "#0f0", "#ff0", "#5c5cff", "#f0f", "#0ff", "#fff"];
const ansiNames = ["Black", "Red", "Green", "Yellow", "Blue", "Magenta", "Cyan", "Gray",
                   "DarkGray", "LightRed", "LightGreen", "LightYellow", "LightBlue", "LightMagenta", "LightCyan", "White"];

function terminalColor(value, fallback) {
    if (value.startsWith("#")) return value;
    const named = ansiNames.indexOf(value);
    if (named >= 0) return ansi[named];
    const indexed = Number(value);
    if (!Number.isInteger(indexed) || indexed < 0 || indexed > 255) return fallback;
    if (indexed < 16) return ansi[indexed];
    const cube = [0, 95, 135, 175, 215, 255];
    if (indexed < 232) {
        const n = indexed - 16;
        return `rgb(${cube[Math.floor(n / 36)]} ${cube[Math.floor(n / 6) % 6]} ${cube[n % 6]})`;
    }
    const gray = (indexed - 232) * 10 + 8;
    return `rgb(${gray} ${gray} ${gray})`;
}

function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
}

function renderRun({text, columns, fg, bg, attributes}) {
    const run = element("span", "run", text);
    run.style.setProperty("--columns", columns);
    let foreground = terminalColor(fg, "var(--terminal-fg)");
    let background = terminalColor(bg, "var(--terminal)");
    if (attributes.includes("reverse")) [foreground, background] = [background, foreground];
    run.style.setProperty("--fg", foreground);
    run.style.setProperty("--bg", background);
    for (const attr of attributes) run.dataset[attr] = "";
    return run;
}

function renderFrame(frame) {
    terminal.style.setProperty("--columns", frame.columns);
    terminal.style.setProperty("--lines", frame.lines);
    terminal.replaceChildren(...frame.rows.map((runs) => {
        const row = element("div", "terminal-row");
        row.append(...runs.map(renderRun));
        return row;
    }));
}

function overlay(className, [column, row, width = 1, height = 1], [left, top]) {
    const mark = element("div", `cell-overlay ${className}`);
    mark.setAttribute("aria-hidden", "true");
    const x = column - left;
    const y = row - top;
    for (const [property, value] of Object.entries({x, y, width, height})) {
        mark.style.setProperty(`--${property}`, value);
    }
    terminal.append(mark);
}

function fact(key, value) {
    metadata.append(element("dt", "", key), element("dd", "", value));
}

const params = new URLSearchParams(location.hash.slice(1));
const requested = Number(params.get("step"));
let currentIndex = 0;
let phase = "after";

function selectStep(index, requestedPhase) {
    currentIndex = Math.min(trace.steps.length - 1, Math.max(0, index));
    const before = currentIndex > 0 && requestedPhase === "before";
    phase = before ? "before" : "after";
    const step = trace.steps[currentIndex];
    const frame = trace.steps[currentIndex - Number(before)].frame;
    const origin = frame.origin ?? [0, 0];
    const originLabel = origin.some(Boolean) ? ` · origin ${origin.join(", ")}` : "";

    byId("step-title").textContent = `${pad(currentIndex)} · ${step.label}`;
    byId("step-count").textContent = `${currentIndex + 1} / ${trace.steps.length}`;
    byId("frame-size").textContent = `${frame.columns} × ${frame.lines}${originLabel} · ${before ? "Before" : "After"}`;
    byId("prev").disabled = currentIndex === 0;
    byId("next").disabled = currentIndex === trace.steps.length - 1;
    byId("before").disabled = currentIndex === 0;
    byId("before").setAttribute("aria-pressed", before);
    byId("after").setAttribute("aria-pressed", !before);
    list.querySelector("[aria-current]")?.removeAttribute("aria-current");
    list.children[currentIndex].firstElementChild.setAttribute("aria-current", "step");

    renderFrame(frame);
    if (frame.cursor) overlay("text-cursor", frame.cursor, origin);
    if (before && step.hit) overlay("hit-region", step.hit.rect, origin);
    if (before && step.pointer) overlay("pointer", step.pointer, origin);

    metadata.replaceChildren();
    fact("Input", step.input);
    if (step.pointer) fact("Before target", step.hit ? `${step.hit.target} · ${step.hit.rect.join(", ")}` : "None");
    if (frame.cursor) fact("Text cursor", frame.cursor.join(", "));
    for (const effect of step.effects) fact("Recorded only", effect);

    history.replaceState(null, "", `#step=${currentIndex}&view=${phase}`);
}

document.title = `${trace.scenario} · Native TUI replay`;
byId("scenario").textContent = trace.title;
trace.steps.forEach((step, index) => {
    const button = element("button", "step-button");
    button.type = "button";
    button.append(element("span", "step-number", pad(index)), element("span", "", step.label));
    button.addEventListener("click", () => selectStep(index, "after"));
    const item = element("li");
    item.append(button);
    list.append(item);
});
function move(delta) { selectStep(currentIndex + delta, "after"); }
byId("prev").addEventListener("click", () => move(-1));
byId("next").addEventListener("click", () => move(1));
byId("before").addEventListener("click", () => selectStep(currentIndex, "before"));
byId("after").addEventListener("click", () => selectStep(currentIndex, "after"));
document.addEventListener("keydown", (event) => {
    if (!event.target.closest(".terminal-scroll") && !event.altKey && !event.ctrlKey && !event.metaKey && ["ArrowLeft", "ArrowRight"].includes(event.key)) {
        event.preventDefault();
        move(event.key === "ArrowLeft" ? -1 : 1);
    }
});
selectStep(Number.isInteger(requested) ? requested : 0, params.get("view"));
</script>
</body>
</html>
