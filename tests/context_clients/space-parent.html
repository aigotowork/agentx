<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>Independent full-Space fixture</title>
<style>html,body{margin:0}iframe{width:450px;height:800px;border:0;display:block}</style>
<iframe id="space" title="Actual complete Space"></iframe>
<script>
window.results=[];
window.addEventListener('message',event=>{const frame=document.querySelector('iframe');if(event.source===frame.contentWindow&&frame.src&&event.origin===new URL(frame.src).origin)window.results.push(event.data);});
</script></html>
