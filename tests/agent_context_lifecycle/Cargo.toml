[package]
name = "agent-context-lifecycle-independent"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[[test]]
name = "composition"
path = "composition.rs"

[[test]]
name = "store"
path = "store.rs"
