[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Build and validate the same native release archives on PRs without publishing.
pr-run-mode = "upload"
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
installers = ["shell", "powershell"]
# Use .tar.gz on Unix so curl-installed users on minimal Linux systems
# don't need a separate `xz` executable just to unpack releases.
unix-archive = ".tar.gz"
# Gate GitHub Release publication on the archives that users will download.
global-artifacts-jobs = ["./verify-native-artifacts"]
github-custom-job-permissions = { "verify-native-artifacts" = { contents = "read" } }
# Extra setup steps to run before dist builds
github-build-setup = "../build-setup.yml"
# Whether dist should create a Github Release or use an existing draft
create-release = true
# Path that installers should place binaries in
install-path = "~/.local/bin"
# Whether to install an updater program
install-updater = false

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2025"
x86_64-unknown-linux-gnu = "ubuntu-22.04"

[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333"
