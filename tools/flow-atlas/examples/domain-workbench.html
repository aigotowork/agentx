<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Flow Atlas · 领域设计</title>
<style>:root {
  --wb-bg: #f5f7fb; --wb-surface: #fff; --wb-ink: #24334a; --wb-muted: #64758c; --wb-line: #dae2ed;
  --wb-accent: #345fcb; --wb-accent-soft: #edf2ff; --wb-good: #16715e; --wb-good-soft: #e8f7f1; --wb-warning: #a56012; --wb-warning-soft: #fff4e4; --wb-danger: #b43949;
  --wb-shadow: 0 8px 32px #263c5d20; --wb-radius: 8px; --wb-border: 1px; --wb-focus: 2px;
  --wb-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; --wb-mono: ui-monospace, monospace;
  --wb-text: 13px; --wb-small: 12px; --wb-title: 16px; --wb-line-height: 1.5;
  --wb-gap: 8px; --wb-gap-small: 4px; --wb-gap-large: 12px; --wb-padding: 10px;
  --wb-control: 34px; --wb-header: 48px; --wb-context: 42px; --wb-navigation: 218px; --wb-details: 340px;
  --wb-player: 72px; --wb-popover: 300px; --wb-mobile-panel: 88%; --wb-details-offset: 6px;
  --wb-icon: 17px; --wb-svg-title: 15px; --wb-svg-text: 12px; --wb-svg-small: 11px;
  --wb-svg-line: 1.5; --wb-svg-active: 3; --wb-dash: 6 4; --wb-marker: 6px; --wb-dot-radius: 4px;
  --wb-notice-bottom: 80px; --wb-tooltip-width: 240px; --wb-scroll-space: 4px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
body { font: var(--wb-text)/var(--wb-line-height) var(--wb-font); color: var(--wb-ink); background: var(--wb-bg); }
button, input, select, textarea { font: inherit; color: inherit; min-width: 0; }
button, select, input[type="search"] { min-height: var(--wb-control); border: var(--wb-border) solid var(--wb-line); border-radius: var(--wb-radius); background: var(--wb-surface); }
button { cursor: pointer; }
button:hover, button[aria-pressed="true"] { color: var(--wb-accent); background: var(--wb-accent-soft); }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: var(--wb-focus) solid var(--wb-accent); outline-offset: var(--wb-border); }
a { color: var(--wb-accent); overflow-wrap: anywhere; }
h1, h2, h3, p { margin: 0; }
h1, h2 { font-size: var(--wb-title); }
h3 { font-size: var(--wb-text); }
pre { white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; font: var(--wb-small)/var(--wb-line-height) var(--wb-mono); }
.visually-hidden { position: absolute; width: var(--wb-border); height: var(--wb-border); overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.muted { color: var(--wb-muted); }
.workbench { display: grid; grid-template-rows: var(--wb-header) var(--wb-context) minmax(0,1fr) auto; width: 100%; height: 100dvh; overflow: hidden; }
.workspace-header, .context-bar { display: flex; align-items: center; gap: var(--wb-gap); padding: var(--wb-gap-small) var(--wb-padding); background: var(--wb-surface); border-bottom: var(--wb-border) solid var(--wb-line); min-width: 0; }
.workspace-header h1 { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view-choice select { max-width: 100%; }
.context-bar label { display: flex; align-items: center; gap: var(--wb-gap-small); min-width: 0; white-space: nowrap; }
.context-bar label select { max-width: var(--wb-navigation); text-overflow: ellipsis; }
.context-help { margin-left: auto; position: relative; }
.context-help summary { cursor: pointer; list-style: none; padding: var(--wb-gap); }
.context-help div { position: absolute; right: 0; top: 100%; z-index: 8; width: var(--wb-popover); padding: var(--wb-padding); background: var(--wb-surface); border: var(--wb-border) solid var(--wb-line); border-radius: var(--wb-radius); box-shadow: var(--wb-shadow); }
.icon-button { min-width: var(--wb-control); padding: var(--wb-gap-small); font-size: var(--wb-icon); }
.compact-button { padding: var(--wb-gap-small) var(--wb-gap); white-space: nowrap; }
.text-button { border: 0; background: transparent; padding: 0; min-height: 0; color: var(--wb-accent); text-align: left; }
.workspace-main { display: flex; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
.resource-navigation { width: var(--wb-navigation); flex: 0 0 var(--wb-navigation); display: flex; flex-direction: column; background: var(--wb-surface); border-right: var(--wb-border) solid var(--wb-line); overflow: hidden; }
.navigation-search { display: flex; gap: var(--wb-gap-small); padding: var(--wb-gap); }
.navigation-search input { width: 100%; padding: var(--wb-gap-small) var(--wb-gap); }
#navigation-close, #navigation-toggle { display: none; }
.resource-list { padding: 0 var(--wb-gap) var(--wb-gap); overflow: auto; min-height: 0; }
.resource-group { margin-bottom: var(--wb-gap); }
.resource-group > summary { font-weight: 600; padding: var(--wb-gap-small); cursor: pointer; }
.resource-row { display: flex; align-items: center; gap: var(--wb-gap-small); width: 100%; border: 0; padding: var(--wb-gap-small) var(--wb-gap); text-align: left; min-height: var(--wb-control); }
.resource-row small { margin-left: auto; color: var(--wb-muted); font-size: var(--wb-small); }
.resource-row .resource-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.resource-children { margin-left: var(--wb-gap-large); border-left: var(--wb-border) solid var(--wb-line); }
.canvas-section { flex: 1; min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr); position: relative; }
.canvas-heading { display: flex; align-items: center; gap: var(--wb-gap); padding: var(--wb-gap-small) var(--wb-gap-large); background: var(--wb-surface); border-bottom: var(--wb-border) solid var(--wb-line); }
.canvas-heading > :first-child { font-weight: 600; }
.canvas-heading #checkpoint-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.canvas { min-width: 0; min-height: 0; overflow: hidden; }
.subject-details { flex: 0 0 var(--wb-details); width: var(--wb-details); min-width: 0; background: var(--wb-surface); border-left: var(--wb-border) solid var(--wb-line); display: flex; flex-direction: column; z-index: 5; }
.details-heading { display: flex; align-items: center; gap: var(--wb-gap); padding: var(--wb-gap); border-bottom: var(--wb-border) solid var(--wb-line); }
.details-heading h2 { flex: 1; overflow-wrap: anywhere; font-size: var(--wb-text); }
.details-body { overflow: auto; min-height: 0; padding: var(--wb-padding); display: flex; flex-direction: column; gap: var(--wb-gap-large); }
.detail-section { display: flex; flex-direction: column; gap: var(--wb-gap); }
.detail-section + .detail-section { border-top: var(--wb-border) solid var(--wb-line); padding-top: var(--wb-gap-large); }
.fact-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,2fr); gap: var(--wb-gap-small) var(--wb-gap); margin: 0; }
.fact-grid dt { color: var(--wb-muted); overflow-wrap: anywhere; }
.fact-grid dd { margin: 0; overflow-wrap: anywhere; }
.detail-row { padding: var(--wb-gap); border: var(--wb-border) solid var(--wb-line); border-radius: var(--wb-radius); overflow-wrap: anywhere; }
.detail-row[data-status="failed"], .diagnostic[data-severity="error"] { border-color: var(--wb-danger); }
.detail-row[data-status="passed"] { border-color: var(--wb-good); }
.ref-link { min-height: var(--wb-control); border: 0; background: transparent; padding: var(--wb-gap-small); color: var(--wb-accent); text-align: left; overflow-wrap: anywhere; }
.schema-tree { border-left: var(--wb-border) solid var(--wb-line); padding-left: var(--wb-gap); overflow-wrap: anywhere; }
.schema-tree summary { cursor: pointer; }
.badge { display: inline-block; font-size: var(--wb-small); padding: 0 var(--wb-gap-small); color: var(--wb-muted); background: var(--wb-bg); border-radius: var(--wb-gap-small); }
.badge[data-status="passed"], .badge[data-status="tested"] { color: var(--wb-good); background: var(--wb-good-soft); }
.badge[data-status="failed"], .badge[data-status="unsupported"] { color: var(--wb-warning); background: var(--wb-warning-soft); }
.scenario-player { display: flex; gap: var(--wb-gap); align-items: center; min-height: var(--wb-player); padding: var(--wb-gap) var(--wb-padding); border-top: var(--wb-border) solid var(--wb-line); background: var(--wb-surface); }
.player-controls { display: flex; align-items: center; gap: var(--wb-gap-small); }
.player-progress { flex: 1; min-width: 0; }
.player-progress input { width: 100%; margin: 0; accent-color: var(--wb-accent); }
.player-caption { display: flex; gap: var(--wb-gap); min-width: 0; font-size: var(--wb-small); }
.player-caption > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layout-panel { position: absolute; right: var(--wb-gap); top: calc(var(--wb-control) + var(--wb-gap)); z-index: 7; width: min(var(--wb-popover),calc(100% - var(--wb-gap-large))); max-height: calc(100% - var(--wb-control) - var(--wb-gap-large)); overflow: auto; padding: var(--wb-padding); background: var(--wb-surface); border: var(--wb-border) solid var(--wb-line); border-radius: var(--wb-radius); box-shadow: var(--wb-shadow); }
.layout-actions { display: flex; gap: var(--wb-gap-small); flex-wrap: wrap; margin-bottom: var(--wb-gap); }
.layout-json { width: 100%; min-height: var(--wb-player); resize: vertical; border: var(--wb-border) solid var(--wb-line); border-radius: var(--wb-radius); padding: var(--wb-gap); font-family: var(--wb-mono); }
.route-status { position: absolute; bottom: var(--wb-gap); right: var(--wb-gap); max-width: min(var(--wb-popover),60%); z-index: 3; padding: var(--wb-gap-small) var(--wb-gap); background: var(--wb-warning-soft); color: var(--wb-warning); border-radius: var(--wb-radius); }
.route-status summary { cursor: pointer; }
.notice:empty { display: none; }
.notice { position: absolute; z-index: 10; bottom: var(--wb-notice-bottom); left: 50%; transform: translateX(-50%); width: min(var(--wb-popover),90%); padding: var(--wb-gap) var(--wb-gap-large); border: var(--wb-border) solid var(--wb-line); border-radius: var(--wb-radius); background: var(--wb-surface); box-shadow: var(--wb-shadow); }
.domain-scene { font-family: var(--wb-font); }
.domain-card { fill: var(--wb-surface); stroke: var(--wb-line); stroke-width: var(--wb-svg-line); }
.domain-card.is-selected { stroke: var(--wb-accent); stroke-width: var(--wb-svg-active); }
.domain-card.is-changed { stroke: var(--wb-good); stroke-width: var(--wb-svg-active); }
.domain-text { fill: var(--wb-ink); font-size: var(--wb-svg-text); }
.domain-title { fill: var(--wb-ink); font-size: var(--wb-svg-title); font-weight: 600; }
.domain-muted { fill: var(--wb-muted); font-size: var(--wb-svg-small); }
.domain-link { fill: var(--wb-accent); font-size: var(--wb-svg-text); cursor: pointer; }
.domain-rule { fill: var(--wb-good); font-size: var(--wb-svg-small); cursor: pointer; }
.domain-port { fill: var(--wb-accent); stroke: var(--wb-accent); stroke-width: var(--wb-svg-line); }
.domain-port[data-kind="query"] { fill: var(--wb-surface); }
.domain-edge { fill: none; stroke: var(--wb-muted); stroke-width: var(--wb-svg-line); }
.domain-edge.is-active { stroke: var(--wb-accent); stroke-width: var(--wb-svg-active); }
.domain-edge.is-visited { stroke: var(--wb-good); }
.domain-edge.is-data { stroke: var(--wb-accent); stroke-dasharray: var(--wb-dash); }
.domain-edge.is-unknown { stroke: var(--wb-warning); stroke-dasharray: var(--wb-dash); }
.domain-state-visited { fill: var(--wb-good-soft); stroke: var(--wb-good); }
.domain-marker { fill: var(--wb-accent); stroke: var(--wb-surface); stroke-width: var(--wb-svg-line); }
.domain-processing { fill: none; stroke: var(--wb-accent); stroke-width: var(--wb-svg-active); stroke-dasharray: var(--wb-dash); }
.domain-diff { fill: var(--wb-good); font-size: var(--wb-svg-small); }
.domain-hit { fill: transparent; stroke: transparent; stroke-width: var(--wb-control); cursor: pointer; }
[data-layout-handle] { cursor: move; touch-action: none; }
[data-layout-handle][data-pinned="true"] { cursor: default; }
[role="button"] { cursor: pointer; }
@media (max-width: 1050px) {
  .subject-details { position: absolute; right: 0; top: 0; bottom: 0; box-shadow: var(--wb-shadow); max-width: calc(100% - var(--wb-gap-large)); }
}
@media (max-width: 700px) {
  #navigation-toggle, #navigation-close { display: inline-block; }
  .workspace-header { gap: var(--wb-gap-small); padding: var(--wb-gap-small); }
  .workspace-header h1 { font-size: var(--wb-text); }
  .resource-navigation { display: none; position: absolute; top: 0; bottom: 0; left: 0; width: var(--wb-mobile-panel); max-width: var(--wb-popover); z-index: 6; box-shadow: var(--wb-shadow); }
  .resource-navigation.is-open { display: flex; }
  .context-bar { gap: var(--wb-gap-small); padding: var(--wb-gap-small); }
  .context-bar label { flex: 1; }
  .context-bar label select { width: 100%; max-width: 100%; }
  .context-help { display: none; }
  .subject-details { width: var(--wb-mobile-panel); }
  .scenario-player { gap: var(--wb-gap-small); padding: var(--wb-gap-small); flex-wrap: wrap; }
  .player-progress { flex-basis: 100%; order: 3; }
  #player-expectations { margin-left: auto; }
  .canvas-heading { padding: var(--wb-gap-small) var(--wb-gap); }
}
@media (prefers-reduced-motion: reduce) { .domain-marker { opacity: .9; } }

:root {
  --spatial-surface: #f6f8fc;
  --spatial-dot: #d3dce9;
  --spatial-control-surface: #fff;
  --spatial-control-line: #d9e2ee;
  --spatial-control-ink: #425875;
  --spatial-control-size: 30px;
  --spatial-control-offset: 10px;
  --spatial-control-radius: 7px;
  --spatial-control-shadow: 0 2px 8px #23324815;
  --spatial-help-width: 260px;
  --spatial-font-size: 12px;
}
.map-panel, .graph-panel { position: relative; }
.spatial-viewport.spatial-viewport {
  position: relative; display: block; min-width: 0; min-height: 0; overflow: hidden;
  padding: 0; border: 0; outline-offset: -2px; touch-action: none; cursor: grab;
  background-color: var(--spatial-surface);
  background-image: radial-gradient(circle, var(--spatial-dot) 1px, transparent 1px);
  background-size: var(--spatial-grid-step,24px) var(--spatial-grid-step,24px);
  background-position: var(--spatial-grid-x,0px) var(--spatial-grid-y,0px);
}
.spatial-viewport[data-panning="true"] { cursor: grabbing; }
.spatial-viewport.spatial-viewport > svg.spatial-scene {
  position: absolute; inset: 0; display: block; width: 100%; height: 100%; min-width: 0;
  min-height: 0; max-width: none; margin: 0; overflow: hidden; background: transparent;
}
.spatial-controls {
  position: absolute; z-index: 3; bottom: var(--spatial-control-offset); left: var(--spatial-control-offset);
  display: flex; align-items: center; background: var(--spatial-control-surface);
  border: 1px solid var(--spatial-control-line); border-radius: var(--spatial-control-radius);
  box-shadow: var(--spatial-control-shadow); color: var(--spatial-control-ink);
}
.spatial-button.spatial-button, .spatial-help > summary {
  display: grid; place-items: center; min-width: var(--spatial-control-size); height: var(--spatial-control-size);
  border: 0; border-radius: var(--spatial-control-radius); margin: 0; padding: 0 7px;
  background: transparent; color: inherit; font: inherit; font-size: var(--spatial-font-size); cursor: pointer;
}
.spatial-button:disabled { opacity: 0.4; cursor: default; }
.spatial-help > summary { list-style: none; }
.spatial-help > summary::-webkit-details-marker { display: none; }
.spatial-help > span {
  position: absolute; bottom: calc(var(--spatial-control-size) + 6px); left: 0;
  width: var(--spatial-help-width); padding: 10px; line-height: 1.7;
  font-size: var(--spatial-font-size); border: 1px solid var(--spatial-control-line);
  border-radius: var(--spatial-control-radius); background: var(--spatial-control-surface);
}
</style>
<body>
<div class="workbench" id="workbench" data-testid="workbench">
  <header class="workspace-header">
    <button id="navigation-toggle" class="icon-button" aria-label="浏览模型资源" aria-expanded="false" aria-controls="navigation" title="浏览模型资源" data-testid="navigation-toggle">☰</button>
    <h1 id="model-title">领域设计</h1>
    <label class="view-choice"><span class="visually-hidden">设计视图</span><select id="view-select" aria-label="设计视图" data-testid="view-select"><option value="objects">对象与关系</option><option value="process">流程</option><option value="dataflow">数据流</option><option value="state">状态</option><option value="sequence">时序</option></select></label>
    <button id="diagnostics-toggle" class="compact-button" data-testid="diagnostics-toggle" title="设计诊断与检查范围">检查 <span id="diagnostic-count"></span></button>
  </header>
  <div class="context-bar">
    <label>用例 <select id="process-select" aria-label="选择用例" data-testid="process-select"></select></label>
    <label>场景 <select id="scenario-select" aria-label="选择场景" data-testid="scenario-select"></select></label>
    <button id="compare-toggle" class="icon-button" aria-label="比较场景和预期" title="比较场景和预期" data-testid="compare-toggle">⇄</button>
    <details class="context-help"><summary aria-label="作者源与能力范围" title="作者源与能力范围">ⓘ</summary><div>TS 定义拥有语义；此页查看导出检查点。布局 JSON 只保存位置。参数只读，播放为示意。</div></details>
  </div>
  <main class="workspace-main">
    <aside class="resource-navigation" id="navigation" aria-label="模型资源" data-testid="resource-navigation">
      <div class="navigation-search"><input id="resource-search" type="search" aria-label="搜索模型资源" placeholder="搜索对象、方法、规则…" data-testid="resource-search"><button id="navigation-close" class="icon-button" aria-label="关闭资源" title="关闭资源">×</button></div>
      <div id="resource-list" class="resource-list"></div>
    </aside>
    <section class="canvas-section" aria-label="领域设计画布">
      <div class="canvas-heading"><span id="canvas-title"></span><span id="checkpoint-label" class="muted" data-testid="checkpoint-label"></span><button id="layout-toggle" class="icon-button" aria-label="布局操作" title="布局操作" data-testid="layout-toggle">⌘</button></div>
      <div id="canvas" class="canvas" data-testid="workbench-canvas"></div>
      <div id="canvas-controls"></div>
      <div id="layout-panel" class="layout-panel" hidden data-testid="layout-panel"></div>
      <div id="route-status" class="route-status" hidden data-testid="route-status"></div>
    </section>
    <aside id="details" class="subject-details" aria-labelledby="details-title" hidden data-testid="subject-details">
      <div class="details-heading"><h2 id="details-title">详情</h2><button id="details-close" class="icon-button" aria-label="关闭详情" title="关闭详情" data-testid="details-close">×</button></div>
      <div id="details-body" class="details-body"></div>
    </aside>
  </main>
  <footer id="player" class="scenario-player" hidden data-testid="scenario-player">
    <div class="player-controls"><button id="player-previous" class="icon-button" aria-label="上一步" title="上一步" data-testid="player-previous">|‹</button><button id="player-play" class="icon-button" aria-label="播放" title="播放" data-testid="player-play">▶</button><button id="player-next" class="icon-button" aria-label="下一步" title="下一步" data-testid="player-next">›|</button><button id="player-replay" class="icon-button" aria-label="重新播放" title="重新播放" data-testid="player-replay">↺</button><label class="speed-choice"><span class="visually-hidden">播放速度</span><select id="player-speed" aria-label="播放速度" data-testid="player-speed"><option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option><option value="2">2×</option></select></label></div>
    <div class="player-progress"><input id="player-position" type="range" min="0" max="0" value="0" aria-label="检查点" data-testid="player-position"><div class="player-caption"><span id="player-phase" data-testid="player-phase"></span><button id="player-call" class="text-button" data-testid="player-call"></button></div></div>
    <button id="player-expectations" class="compact-button" data-testid="player-expectations">预期</button>
  </footer>

  byId('resource-search').addEventListener('input',event=>{state.query=event.target.value;paintNavigation();});byId('navigation-toggle').addEventListener('click',()=>{const opened=navigation.classList.toggle('is-open');byId('navigation-toggle').setAttribute('aria-expanded',String(opened));if(opened)byId('resource-search').focus();});byId('navigation-close').addEventListener('click',()=>closeNavigation());
  byId('details-close').addEventListener('click',closeDetails);byId('diagnostics-toggle').addEventListener('click',event=>select({kind:'diagnostics',id:'diagnostics'},event.target));byId('compare-toggle').addEventListener('click',event=>select({kind:'comparison',id:'comparison'},event.target));
  byId('layout-toggle').addEventListener('click',()=>{byId('layout-panel').hidden=!byId('layout-panel').hidden;if(!byId('layout-panel').hidden)byId('layout-panel').querySelector('button:not(:disabled)').focus();});
  byId('player-play').addEventListener('click',()=>player.state().playing?player.pause():player.play());byId('player-previous').addEventListener('click',()=>player.previous());byId('player-next').addEventListener('click',()=>player.next());byId('player-replay').addEventListener('click',()=>player.replay());byId('player-speed').addEventListener('change',event=>player.speed(Number(event.target.value)));byId('player-position').addEventListener('input',event=>player.seek(Number(event.target.value)));byId('player-expectations').addEventListener('click',event=>select({kind:'expectations',id:state.scenarioId},event.target));byId('player-call').addEventListener('click',event=>select({kind:'call',id:byId('player-call').dataset.callId},event.target));
  document.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(!byId('layout-panel').hidden){byId('layout-panel').hidden=true;byId('layout-toggle').focus();}else if(!details.hidden)closeDetails();else if(navigation.classList.contains('is-open'))closeNavigation();else{const open=document.querySelector('details[open].context-help');if(open)open.open=false;}event.preventDefault();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)player.pause();});window.addEventListener('pagehide',()=>player.pause());
  // Read-only detached presentation snapshot for independent acceptance/consumer inspection.
  globalThis.FlowAtlasWorkbench=Object.freeze({state(){const c=context(),p=player.state();return JSON.parse(JSON.stringify({view:state.view,processId:state.processId,scenarioId:state.scenarioId,selection:state.selection,checkpoint:c.checkpoint,presentation:{index:p.index,elapsed:p.elapsed,progress:p.progress,phase:p.phase,playing:p.playing,speed:p.speed,targetId:p.target?.id},camera:viewport.state(),layout:layout.state()}));}});
  updateChoices();paintNavigation();player.context(null);
}());
</script>
