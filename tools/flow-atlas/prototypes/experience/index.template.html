<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; base-uri 'none'; form-action 'none'">
<title>Flow Atlas · 领域画布</title>
<style>__EXPERIENCE_STYLES__</style>
<body>
<div class="workbench experience-workspace" id="workbench" data-testid="workbench">
  <header class="workspace-header">
    <button id="navigation-toggle" class="icon-button" aria-label="浏览模型资源" aria-expanded="false" aria-controls="navigation" title="浏览模型资源" data-testid="navigation-toggle">☰</button>
    <span class="atlas-mark" aria-hidden="true"><svg viewBox="0 0 28 28"><path d="M6 8h16M6 20h16M9 8v12M19 8v12"/><rect x="3" y="5" width="6" height="6" rx="2"/><rect x="16" y="17" width="9" height="6" rx="2"/></svg></span>
    <span class="product-name">Flow Atlas</span><span class="header-divider" aria-hidden="true"></span>
    <h1 id="model-title">领域画布</h1>
    <details class="context-help scope-help"><summary aria-label="体验提案与作者源" title="体验提案与作者源" data-testid="experience-scope">体验提案 <span aria-hidden="true">ⓘ</span></summary><div><strong>源定义 · 离线快照</strong><p>对象、方法与规则来自导出的 TS 模型。此页用于调查与评审；布局只保存位置，播放只示意已导出的检查点。</p><p>语义修改仍在作者源中完成。</p></div></details>
    <button id="diagnostics-toggle" class="compact-button check-button" data-testid="diagnostics-toggle" title="设计诊断与检查范围"><span class="check-glyph" aria-hidden="true">✓</span> 检查 <span id="diagnostic-count"></span></button>
  </header>
  <div class="context-bar">
    <span class="context-kicker">工作上下文</span>
    <label class="process-choice"><span>用例</span><select id="process-select" aria-label="选择用例" data-testid="process-select"></select></label>
    <span class="context-link" aria-hidden="true">/</span>
    <label class="scenario-choice"><span>场景</span><select id="scenario-select" aria-label="选择场景" data-testid="scenario-select"></select></label>
    <button id="compare-toggle" class="compact-button" aria-label="比较场景和预期" title="比较场景和预期" data-testid="compare-toggle">比较场景</button>
    <span id="experience-basis" class="context-basis">定义</span>
  </div>
  <main class="workspace-main">
    <aside class="resource-navigation" id="navigation" aria-label="模型资源" data-testid="resource-navigation">
      <div class="navigation-heading"><strong>资源</strong><span id="experience-resource-count" class="muted"></span><button id="navigation-close" class="icon-button" aria-label="关闭资源" title="关闭资源">×</button></div>
      <div class="navigation-tabs" role="group" aria-label="资源分类"><button class="navigation-tab" data-testid="experience-nav-model" data-nav-category="model" aria-pressed="true">领域模型</button><button class="navigation-tab" data-testid="experience-nav-cases" data-nav-category="cases" aria-pressed="false">用例与场景</button></div>
      <div class="navigation-search"><span aria-hidden="true">⌕</span><input id="resource-search" type="search" aria-label="搜索模型资源" placeholder="搜索资源…" data-testid="resource-search"><kbd>/</kbd></div>
      <div id="resource-list" class="resource-list"></div>
      <div id="experience-resource-summary" class="resource-summary"></div>
    </aside>
    <section class="canvas-section" aria-label="领域设计画布">
      <div class="canvas-heading">
        <nav class="view-strip" aria-label="关联设计视图">
          <button class="view-tab" data-view="objects" data-testid="experience-view-objects" aria-pressed="true">对象<span class="view-tab-detail">与关系</span></button>
          <button class="view-tab" data-view="process" data-testid="experience-view-process" aria-pressed="false">流程</button>
          <button class="view-tab" data-view="dataflow" data-testid="experience-view-dataflow" aria-pressed="false">参数来源</button>
          <button class="view-tab" data-view="state" data-testid="experience-view-state" aria-pressed="false">状态</button>
          <button class="view-tab" data-view="sequence" data-testid="experience-view-sequence" aria-pressed="false">时序</button>
        </nav>
        <label class="visually-hidden"><span>设计视图</span><select id="view-select" tabindex="-1" aria-label="设计视图" data-testid="view-select"><option value="objects">对象与关系</option><option value="process">流程</option><option value="dataflow">参数来源</option><option value="state">状态</option><option value="sequence">时序</option></select></label>
        <button id="experience-binding-focus" class="compact-button" data-testid="experience-binding-focus" hidden title="在所选参数与完整数据流之间切换">关联全图</button>
        <button id="layout-toggle" class="icon-button" aria-label="布局操作" title="布局操作" data-testid="layout-toggle">⌘</button>
      </div>
      <div id="canvas" class="canvas" tabindex="0" data-testid="workbench-canvas"></div>
      <div class="canvas-location" aria-hidden="true"><span id="canvas-title"></span><span class="location-divider">·</span><span id="checkpoint-label" data-testid="checkpoint-label"></span></div>
      <div id="canvas-controls"></div>
      <div id="layout-panel" class="layout-panel" hidden data-testid="layout-panel"></div>
      <div id="route-status" class="route-status" hidden data-testid="route-status"></div>
    </section>
    <aside id="details" class="subject-details" aria-labelledby="details-title" hidden data-testid="subject-details">
      <div class="inspector-context"><button id="experience-back" class="compact-button" data-testid="experience-back" aria-label="返回上一个资源" title="返回上一个资源" disabled>← 返回</button><span id="experience-subject-kind" class="inspector-kind"></span></div>
      <div class="details-heading"><h2 id="details-title">详情</h2><button id="details-close" class="icon-button" aria-label="关闭详情" title="关闭详情" data-testid="details-close">×</button></div>
      <div id="details-body" class="details-body"></div>
    </aside>
  </main>
  <footer id="player" class="scenario-player" hidden data-testid="scenario-player">
    <div class="scenario-evidence">
      <div class="checkpoint-context"><strong id="experience-scenario-name"></strong><span id="experience-witness-basis" class="badge"></span><span class="illustrative-label">示意播放</span></div>
      <div class="checkpoint-rail" id="experience-checkpoints" aria-label="场景检查点" data-testid="experience-checkpoints"></div>
      <div class="evidence-pair"><div class="evidence-fact" data-testid="experience-caller"><span class="evidence-label">调用方所知</span><strong id="experience-caller-value">初态</strong></div><div class="evidence-fact" data-testid="experience-effect"><span class="evidence-label">拥有者效果</span><strong id="experience-effect-value">尚无记录</strong></div><span id="experience-applied" class="applied-checkpoint"></span></div>
    </div>
    <div class="player-toolbar">
      <div class="player-controls"><button id="player-previous" class="icon-button" aria-label="上一步" title="上一步" data-testid="player-previous">|‹</button><button id="player-play" class="icon-button primary-icon" aria-label="播放" title="播放" data-testid="player-play">▶</button><button id="player-next" class="icon-button" aria-label="下一步" title="下一步" data-testid="player-next">›|</button><button id="player-replay" class="icon-button" aria-label="重新播放" title="重新播放" data-testid="player-replay">↺</button><label class="speed-choice"><span class="visually-hidden">播放速度</span><select id="player-speed" aria-label="播放速度" data-testid="player-speed"><option value="0.25">0.25×</option><option value="0.5" selected>0.5×</option><option value="1">1×</option><option value="2">2×</option></select></label></div>
      <div class="player-progress"><input id="player-position" type="range" min="0" max="0" value="0" aria-label="检查点" data-testid="player-position"><div class="player-caption"><span id="player-phase" data-testid="player-phase"></span><button id="player-call" class="text-button" data-testid="player-call"></button></div></div>
      <button id="player-expectations" class="compact-button" data-testid="player-expectations">预期与证据</button>
    </div>
  </footer>
  <div id="notice" class="notice" role="status" aria-live="polite" data-testid="workbench-notice"></div>
  <div id="experience-tooltip" class="experience-tooltip" role="tooltip" hidden></div>
</div>
<script id="workbench-model" type="application/json">__EXPERIENCE_MODEL__</script>
<script>__EXPERIENCE_SCRIPT__</script>
</body>
</html>
