# Curated vocabulary adapted from the xsaas Logo method. See ../research/sources.md.
schema_version: 1
purpose: Seed vocabulary for reference discovery and candidate description; not a populated image library or quality ranking.
tag_policy:
  identity: [facet_id, value_id]
  multivalue: true
  coverage: Open and extensible; tag presence does not establish creative or task completeness.
  distinction: Facets answer different questions; values within or across facets can overlap without becoming synonyms.
  scope: Subject details such as species and specific cultural periods can use attributed local extensions.
  subjectivity: Detail density and intended expression are contextual judgments, not measured quality scores.
  unknown: Omit unsupported tags; retain proposed tags with attribution and confidence in the reference record.
  extension: Add a scoped project tag before promoting it to the shared vocabulary.
  compatibility: Preserve IDs; use aliases or an explicit migration for renames.
facets:
  identity_form:
    meaning: What kind of identifying carrier is this, rather than what it depicts or how it is rendered.
    label: {en: Identity form, zh: 标识形式}
    values:
      - {id: symbol, en: Symbol, zh: 图形标, meaning: A standalone abstract or representational identifier}
      - {id: wordmark, en: Wordmark, zh: 字标, meaning: The brand name designed as an identifier}
      - {id: monogram, en: Monogram, zh: 字母组合, meaning: Selected letters combined into an identifier}
      - {id: emblem, en: Emblem, zh: 徽章, meaning: An integrated framed arrangement of symbol and other identifying elements}
      - {id: mascot, en: Mascot, zh: 吉祥物, meaning: A character acting as an identifying presence}
      - {id: combination, en: Combination mark, zh: 图文组合, meaning: A symbol and name arranged as a related identifier}
      - {id: variable-family, en: Variable family, zh: 可变标识家族, meaning: Related identifiers produced through shared invariants and controlled change}
  subject:
    meaning: What is depicted or written; the subject alone does not identify style or intended association.
    label: {en: Subject, zh: 题材}
    values:
      - {id: abstract, en: Abstract form, zh: 抽象形态}
      - {id: letters, en: Letters, zh: 字母文字}
      - {id: animal, en: Animal, zh: 动物}
      - {id: invented-creature, en: Invented creature, zh: 虚构生物}
      - {id: human-gesture, en: Human or gesture, zh: 人物与动作}
      - {id: botanical, en: Botanical, zh: 植物}
      - {id: landscape, en: Landscape, zh: 地景}
      - {id: celestial, en: Celestial, zh: 天体}
      - {id: architecture, en: Architecture, zh: 建筑空间}
      - {id: mechanism, en: Mechanism, zh: 机械结构}
      - {id: tool, en: Tool, zh: 工具}
      - {id: everyday-object, en: Everyday object, zh: 日常物件}
      - {id: cultural-motif, en: Cultural motif, zh: 文化母题}
  semantic_relation:
    meaning: The organizing metaphor or relationship proposed by the direction; not the literal object or a proven audience interpretation.
    label: {en: Organizing relationship, zh: 概念组织关系}
    values:
      - {id: joining, en: Joining, zh: 连接}
      - {id: growing, en: Growing, zh: 生长}
      - {id: revealing, en: Revealing, zh: 显露}
      - {id: navigating, en: Navigating, zh: 导航}
