      - {id: weaving, en: Weaving, zh: 编织协同}
      - {id: signing, en: Signing, zh: 署名}
  visual_language:
    meaning: The visible grammar of contours, strokes, detail and lettering; not the software operation used to create them.
    label: {en: Visual language, zh: 视觉语言}
