<style>
* { box-sizing:border-box }
body { margin:0; background:#dedacc; color:#2e424e; font:13px system-ui,sans-serif }
main { width:min(848px,100%); padding:clamp(12px,3.5vw,24px); margin:auto }
header { display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:4px 12px; padding:4px 0 12px; border-bottom:1px solid #7d877f; margin-bottom:12px }
h1 { font:500 clamp(26px,5vw,40px)/1 Georgia,serif; letter-spacing:-.035em; margin:0 }
header span, h2 { font-size:10px; text-transform:uppercase; letter-spacing:.13em }
.stage { position:relative; aspect-ratio:800 / 450; isolation:isolate; container-type:inline-size; overflow:hidden; border-radius:4px; outline:1px solid #465b625c }
.stage img,.room-shadow,.office { position:absolute; left:calc(var(--x)*.125cqw); top:calc(var(--y)*.125cqw); width:calc(var(--w)*.125cqw); height:calc(var(--h)*.125cqw) }
.stage img { display:block }
.office,.room-shadow { --x:126; --y:65; --w:548; --h:326 }
.room-shadow { transform:translate(1cqw,1cqw); background:#4964724a }
.office { overflow:hidden }
.tiles,.window-light,.lamp-light,.rear,.edge { position:absolute; inset:0 }
.tiles { background:url(floor-oak.svg) left top / 16cqw 16cqw repeat }
.window-light { background:linear-gradient(125deg,#627d8554,transparent 42%,#667c785c 95%),radial-gradient(ellipse at 28% 22%,#eef0cc81,transparent 52%) }
.lamp-light { background:radial-gradient(circle at 8% 35%,#f7d4a097,transparent 24%) }
.rear { bottom:auto; height:8cqw; background:url(wall-plaster.svg) left top / 20cqw 8cqw repeat-x }
.edge { border-inline: .75cqw solid #79867e; box-shadow:inset .23cqw 0 #d6bc8d,inset -.23cqw 0 #d6bc8d }
.edge::after { content:""; height:.75cqw; position:absolute; inset:auto 0 0; background:linear-gradient(to right,#79867e 5%,transparent 5% 17%,#79867e 17%) }
.label { position:absolute; left:calc(var(--x)*.125cqw); top:calc(var(--y)*.125cqw); transform:translateX(-50%); padding:0 .48cqw; border-radius:.38cqw; color:#293e49; background:#f3ead6e8; font-size:1.25cqw; font-weight:650 }
.cast { margin-top:18px; padding-top:12px; border-top:1px solid #7d877f; display:grid; gap:10px }
h2 { font-weight:650; margin:0 }
.lineup { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px }
figure { min-width:0; margin:0 }
figure div { height:94px; display:grid; place-items:center; background:#ede2ca; border:1px solid #b5a99a }
figure img { width:64px; height:72px }
figcaption { padding-top:5px; font-size:11px }
</style>
