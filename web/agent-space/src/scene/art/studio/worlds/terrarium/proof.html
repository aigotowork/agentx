<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terrarium · Space world proof</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #e8dcb4;
    --paper: #f9f1d8;
    --ink: #173932;
    --muted: #516554;
    --rule: #bba775;
    --brush: #963e2e;
    --measure: 58rem;
    --column: 1.25rem;
    --avatar-width: 64px;
    --avatar-height: 72px;
    --badge-size: 24px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--ink);
    font: 1rem/1.4 system-ui, sans-serif;
  }
  main {
    width: min(calc(100% - var(--column) * 2), var(--measure));
    margin: 1.5rem auto;
    padding: 1rem var(--column) var(--column);
    background: var(--paper);
    border: 1px solid var(--rule);
  }
  header, .plate-label {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: .5rem var(--column);
    flex-wrap: wrap;
  }
  header { margin-bottom: .75rem; }
  h1, h2, p, figure { margin: 0; }
  h1 { font: 3.25rem/.98 Georgia, serif; letter-spacing: -.06em; }
  h1 span { margin-left: .4rem; font: 1.3rem system-ui, sans-serif; letter-spacing: .08em; }
  .spec { color: var(--muted); font-size: .76rem; }
  .room { width: 100%; height: auto; display: block; background: var(--canvas); }
  .details { display: grid; grid-template-columns: 2fr 1fr; gap: var(--column); margin-top: .85rem; }
  .strip { border-top: 1px solid var(--rule); padding-top: .4rem; }
  h2 { color: var(--brush); font-size: .78rem; font-weight: 750; }
  .lineup, .signals {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    list-style: none;
    padding: 0;
    margin: .35rem 0 0;
    text-align: center;
  }
  .lineup img { display: block; width: var(--avatar-width); height: var(--avatar-height); margin: 0 auto .2rem; }
  .signals img { display: block; height: var(--badge-size); margin: 0 auto .2rem; }
  .samples { margin: .65rem 0 .25rem; font-size: .74rem; }
  .lineup li, .signals li { font-size: .72rem; }
  @media (max-width: 40rem) {
    :root { --column: .65rem; }
    main { margin: .65rem auto; }
    h1 { font-size: 2.6rem; }
    .details { grid-template-columns: 1fr; }
  }
</style>
<main>
  <header data-layout="proof-heading">
    <h1>Terrarium <span lang="zh">苔庭</span></h1>
    <p class="spec">Space · Greenhouse office</p>
  </header>
  <figure data-block="greenhouse-office">
    <svg class="room" viewBox="0 0 800 403" role="img" aria-labelledby="office-description">
      <title id="office-description">Cutaway glasshouse office with four botanical characters, drafting desks, a tea nook and an entrance mailbox</title>
      <defs>
        <pattern id="stone-coursing" width="128" height="128" x="24" y="15" patternUnits="userSpaceOnUse">
          <image href="floor-oak.svg" width="128" height="128"/>
        </pattern>
        <pattern id="iron-bays" width="160" height="64" x="24" y="15" patternUnits="userSpaceOnUse">
          <image href="wall-plaster.svg" width="160" height="64"/>
        </pattern>
        <linearGradient id="sun-wash" x1="0" y1="0" x2=".5" y2="1" gradientUnits="objectBoundingBox">
          <stop stop-color="#fff0ac" stop-opacity=".54"/>
          <stop offset="1" stop-color="#ffebbd" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect x="31" y="22" width="752" height="362" fill="#304535" opacity=".27"/>
      <rect x="24" y="15" width="752" height="362" fill="url(#stone-coursing)"/>
      <g fill="url(#sun-wash)">
        <path d="M55 48h70L57 224H31v-78Z"/>
        <path d="M128 47h36L90 267H63Z"/>
        <path d="M665 46h66l-99 227h-54Z"/>
        <path d="M739 47h28l-76 151h-27Z"/>
      </g>
      <rect x="24" y="15" width="752" height="64" fill="url(#iron-bays)"/>
      <g data-block="greenhouse-shell">
        <image href="wall-window.svg" x="51" y="16" width="120" height="48"/>
        <image href="wall-print.svg" x="373" y="16" width="54" height="48"/>
        <image href="wall-window.svg" x="626" y="16" width="120" height="48"/>
        <path fill="#2d5b49" d="M24 15h6v362h-6zm746 0h6v362h-6zM24 371h373v6H24zm437 0h315v6H461z"/>
        <path fill="#9bba82" d="M25 15h2v354h-2zm746 0h2v354h-2z"/>
        <image href="door-threshold.svg" x="397" y="345" width="64" height="32"/>
      </g>
      <g data-block="office-furniture">
        <image href="rug.svg" x="555" y="220" width="192" height="112"/>
        <image href="bookshelf.svg" x="48" y="67" width="56" height="64"/>
        <image href="cabinet.svg" x="127" y="67" width="68" height="64"/>
        <image href="plant.svg" x="200" y="74" width="32" height="46"/>
        <image href="plant.svg" x="495" y="75" width="32" height="46"/>
        <image href="plant.svg" x="725" y="184" width="32" height="46"/>
        <image href="coffee.svg" x="545" y="169" width="54" height="62"/>
        <image href="sofa.svg" x="613" y="174" width="108" height="60"/>
        <image href="plant.svg" x="39" y="268" width="32" height="46"/>
        <image href="desk.svg" x="91" y="140" width="86" height="68"/>
        <image href="stool.svg" x="115" y="198" width="38" height="36"/>
        <image href="desk.svg" x="239" y="140" width="86" height="68"/>
        <image href="stool.svg" x="263" y="198" width="38" height="36"/>
        <image href="desk.svg" x="387" y="140" width="86" height="68"/>
        <image href="stool.svg" x="411" y="198" width="38" height="36"/>
        <image href="human-mailbox.svg" x="473" y="304" width="62" height="62"/>
        <image href="envelope.svg" x="458" y="297" width="24" height="16"/>
      </g>
      <g data-block="office-cast">
        <image href="actor-maker.svg" x="102" y="146" width="64" height="72"/>
        <image href="glyph-work.svg" x="154" y="163" width="24" height="24"/>
        <image href="glyph-select.svg" x="297" y="267" width="64" height="24"/>
        <image href="actor-designer.svg" x="297" y="207" width="64" height="72"/>
        <image href="glyph-available.svg" x="349" y="224" width="24" height="24"/>
        <image href="actor-keeper.svg" x="469" y="151" width="64" height="72"/>
        <image href="glyph-attention.svg" x="521" y="168" width="24" height="24"/>
        <image href="actor-scout.svg" x="618" y="230" width="64" height="72"/>
        <image href="glyph-available.svg" x="670" y="247" width="24" height="24"/>
      </g>
    </svg>
  </figure>
  <div class="details" data-layout="art-detail">
    <section class="strip" data-block="cast-lineup" aria-labelledby="cast-title">
      <div class="plate-label"><h2 id="cast-title">Cast</h2><p class="spec">64 × 72 px</p></div>
      <ul class="lineup">
        <li><img src="actor-maker.svg" alt="Radish suit with split leaves and a wrench">Maker</li>
        <li><img src="actor-designer.svg" alt="Pink orchid headdress and color swatches">Designer</li>
        <li><img src="actor-keeper.svg" alt="Acorn cap, glasses and seed tray">Keeper</li>
        <li><img src="actor-scout.svg" alt="Ginkgo hood, teal cape and telescope">Scout</li>
      </ul>
    </section>
    <section class="strip" data-block="state-key" aria-labelledby="signal-title">
      <h2 id="signal-title">State markings</h2>
      <ul class="signals">
        <li><img src="glyph-work.svg" alt="">Work</li>
        <li><img src="glyph-available.svg" alt="">Available</li>
        <li><img src="glyph-attention.svg" alt="">Attention</li>
        <li><img src="glyph-select.svg" alt="">Selected</li>
      </ul>
      <p class="samples spec">Studio placements · Art-only proof</p>
    </section>
  </div>
</main>
</html>
