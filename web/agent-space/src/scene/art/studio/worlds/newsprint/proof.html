<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Newsprint | After-hours comics studio</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #211a26; color: #f7e7bf; font: 14px/1.4 system-ui, sans-serif; }
  main { width: min(100%, 1040px); margin: auto; padding: 24px; }
  header { display:flex; justify-content:space-between; align-items:baseline; gap:16px; border-bottom:2px solid #d9463d; padding-bottom:12px; }
  h1 { margin:0; font: 700 19px/1.1 system-ui,sans-serif; text-transform:uppercase; }
  header span { color:#cbbca5; }
  .room { display:block; width:100%; height:auto; margin:18px 0; background:#ead5ae; }
  .cast { display:flex; justify-content:space-around; align-items:end; gap:16px; flex-wrap:wrap; padding:14px; background:#f7e7bf; color:#211a26; border-bottom:5px solid #d9463d; }
  figure { width:96px; margin:0; text-align:center; }
  figure img { display:block; width:64px; height:72px; margin:auto; }
  figcaption { margin-top:5px; font-weight:700; }
  @media(max-width:560px) { main {padding:14px;} header {align-items:start; flex-direction:column;} .room {margin:12px 0;} }
</style>

  <section class="cast" aria-label="Character masters at native display size">
    <figure><img src="actor-maker.svg" alt=""><figcaption>Maker · brayer</figcaption></figure>
    <figure><img src="actor-designer.svg" alt=""><figcaption>Designer · proof</figcaption></figure>
    <figure><img src="actor-keeper.svg" alt=""><figcaption>Keeper · folio</figcaption></figure>
    <figure><img src="actor-scout.svg" alt=""><figcaption>Scout · courier</figcaption></figure>
