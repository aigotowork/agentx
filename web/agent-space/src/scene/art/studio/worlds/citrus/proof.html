<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Citrus · Studio art proof</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eae9dd; color: #41564b; font: 14px/1.4 system-ui, sans-serif; }
  main { max-width: 844px; margin: auto; padding: 25px 22px 24px; }
  header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 4px 16px; border-bottom: 1px solid #bcc8b5; padding: 0 1px 11px; margin: 0 0 15px; }
  h1 { margin: 0; font: 500 25px Georgia, serif; }
  h1 span { color: #65796e; }
  header p { margin: 0; color: #52695e; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .room { display: block; width: 100%; height: auto; background: #c7e3db; box-shadow: 0 8px 22px #536b5426; }
  .cast { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 10px; margin: 16px 0 0; }
  figure { display: flex; align-items: center; gap: 5px; margin: 0; padding: 8px 7px; background: #f7f2e5; border: 1px solid #d3d4bf; }
  figure img { flex: 0 0 64px; }
  figcaption { color: #4e685a; font: 17px Georgia, serif; }
  figcaption span { display: block; color: #53665b; font: 11px/1.35 system-ui, sans-serif; margin-top: 4px; }
  @media (max-width: 670px) { main { padding: 14px; } .cast { grid-template-columns: repeat(2,minmax(0,1fr)); } }
</style>
