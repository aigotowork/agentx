<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #131a28; color: #eff2d9; font: 14px system-ui, sans-serif; }
  main { width: min(842px, 100%); margin: 0 auto; padding: 20px; }

  h1 { font: 400 clamp(27px, 6vw, 44px) Georgia, serif; }

  .cast { background: linear-gradient(150deg, #2e4150, #172332 75%); border: 1px solid #49616a; padding: 13px 15px; }
  .lineup { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 10px; }
  .lineup figure { text-align: center; padding: 2px 6px 0; min-width: 0; }
  .lineup figure + figure { border-left: 1px solid #526573; }
  .lineup img { display: block; width: 64px; height: 72px; margin: 0 auto 5px; }
  figcaption strong, figcaption small { display: block; }
  figcaption strong { font-family: Georgia, serif; font-size: 17px; font-weight: 400; }
  figcaption small { color: #acd2ca; }
  @media (max-width: 440px) {
    main { padding: 12px; }
    .lineup { grid-template-columns: repeat(2, 1fr); gap: 12px 0; }
    .lineup figure:nth-child(3) { border-left: 0; }
  }
</style>
