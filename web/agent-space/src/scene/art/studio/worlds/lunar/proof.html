<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lunar · Farside office</title>
  <style>
    :root {
      color-scheme: dark;
      --void: #0b132c;
      --court: #101b32;
      --edge: #50688d;
      --hull: #395d95;
      --rim: #81b2db;
      --ice: #d9eeff;
      --muted: #a1b9d8;
      --panel: #192745;
      --accent: #ffb578;
      background: var(--void);
      color: var(--ice);
      font: 15px/1.5 system-ui, sans-serif;
    }
    body { margin: 0; }
    main { max-width: 940px; margin: 0 auto; padding: clamp(20px, 5vw, 48px); }
    header { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
    h1 { font-size: clamp(28px, 5vw, 42px); line-height: 1; margin: 0; }
    header span { color: var(--accent); }
    .scene { border: 1px solid var(--edge); display: block; width: 100%; height: auto; box-sizing: border-box; }
    .courtyard { fill: var(--court); }
    .hull-shadow { fill: #070f23; }
    .hull-edge { fill: var(--hull); }
    .hull-rim { fill: var(--rim); }
    h2 { margin: 20px 0 9px; font-size: 14px; font-weight: 500; color: var(--muted); }
    .cast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    figure { margin: 0; text-align: center; padding: 8px 0; background: var(--panel); border: 1px solid var(--edge); }
    figure img { display: block; margin-inline: auto; }
    figcaption { font-size: 12px; margin-top: 3px; }
  </style>
</head>
