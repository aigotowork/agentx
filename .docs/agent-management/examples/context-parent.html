<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AgentX context parent</title><link rel="stylesheet" href="context-parent.css"><script src="context-parent.js" defer></script>
<main><section><h1>Existing Agent conversation</h1><form id="open"><label>Service URL<input id="service" value="http://127.0.0.1:18764" required></label><label>Exact target JSON<textarea id="target" required placeholder='{"scope":"/tmp/scope","generation":"UUID","agent":{"name":"toku","incarnation":"BITS","stopped_event":null}}'></textarea></label><button>Open iframe</button></form><form id="context"><label>Page title<input id="title"></label><label>Page text<textarea id="text"></textarea></label><label>Source URL<input id="source" type="url"></label><label>Images/files<input id="files" type="file" multiple></label><button id="add" disabled>Add to pending draft</button></form><output id="status">Open a target, then wait for bridge readiness.</output></section><iframe id="conversation" title="AgentX existing conversation"></iframe></main></html>
