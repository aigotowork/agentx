.line{fill:none;stroke:#e0e6eb;stroke-width:1}.border{fill:#fff;stroke:#ced8df;stroke-width:1}
.accent{fill:#176b5b}.green{fill:#176b5b}.amber{fill:#8e610d}.red{fill:#b04c45}.blue{fill:#45649a}
