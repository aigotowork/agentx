<text x="24" y="355" class="small medium muted" >标题 *</text>
<rect x="24" y="368" width="660" height="36" rx="5" class="invalid-field"/>
<text x="38" y="392" class="caption" ></text>
<text x="24" y="425" class="caption red" >请输入任务标题</text>
<rect x="24" y="449" width="144" height="32" rx="5" class="accent"/><text x="96.0" y="470.0" class="medium white" text-anchor="middle">保存任务</text>
<rect x="183" y="449" width="144" height="32" rx="5" class="accent"/><text x="255.0" y="470.0" class="medium white" text-anchor="middle">保存中…</text>
<rect x="344" y="449" width="152" height="32" rx="5" class="wash"/>
