<rect x="421" y="247" width="99" height="24" rx="4" class="amber-bg"/><text x="470.5" y="264" class="small medium amber" text-anchor="middle">等你 · Q1</text>
<g aria-label="答复 Q1"><title>答复 Q1</title><rect x="633" y="243" width="32" height="32" rx="5" class="paper"/><path d="M2 2h13v10H8l-5 4v-4H2zM5 6h7M5 9h4" transform="translate(641.0 251.0)" class="stroke"/></g>
