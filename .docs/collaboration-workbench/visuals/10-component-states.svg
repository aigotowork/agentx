<rect x="38" y="780" width="158" height="32" rx="5" class="border"/><text x="117.0" y="801.0" class="medium" text-anchor="middle">查看字段差异</text>
<rect x="212" y="780" width="216" height="32" rx="5" class="border"/><text x="320.0" y="801.0" class="medium" text-anchor="middle">基于更新继续编辑</text>
<text x="24" y="864" class="caption medium" >关闭未保存编辑器</text>
<rect x="24" y="880" width="186" height="32" rx="5" class="border"/><text x="117.0" y="901.0" class="medium" text-anchor="middle">继续编辑</text>
<rect x="226" y="880" width="186" height="32" rx="5" class="border"/><text x="319.0" y="901.0" class="medium" text-anchor="middle">放弃更改</text>
<path d="M708 78L708 1028" class="line"/>
<text x="736" y="90" class="section" >事实、检查与模式</text>
<rect x="736" y="111" width="333" height="24" rx="4" class="blue-bg"/><text x="902.5" y="128" class="small medium blue" text-anchor="middle">Lin 上报结果 r2</text>
<rect x="736" y="151" width="333" height="24" rx="4" class="green-bg"/><text x="902.5" y="168" class="small medium green" text-anchor="middle">Moss 上报通过 · C2</text>
<rect x="736" y="191" width="333" height="24" rx="4" class="red-bg"/><text x="902.5" y="208" class="small medium red" text-anchor="middle">检查失败 · 已覆盖文件</text>
<rect x="736" y="231" width="333" height="24" rx="4" class="amber-bg"/><text x="902.5" y="248" class="small medium amber" text-anchor="middle">无法检查 · 缺少环境依据</text>
<rect x="736" y="271" width="333" height="24" rx="4" class="green-bg"/><text x="902.5" y="288" class="small medium green" text-anchor="middle">已接受 r2 / C2 / b1</text>
<rect x="736" y="311" width="333" height="24" rx="4" class="green-bg"/><text x="902.5" y="328" class="small medium green" text-anchor="middle">历史通过 · r1 / b1</text>
<text x="736" y="385" class="section" >读取、空集与只读</text>
<rect x="736" y="404" width="680" height="56" rx="5" class="wash"/>
<rect x="751" y="420" width="131" height="10" rx="3" class="skeleton"/>
<rect x="751" y="438" width="238" height="8" rx="3" class="skeleton"/>
