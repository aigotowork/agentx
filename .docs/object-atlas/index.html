   return `<g aria-hidden="true"><rect class="zone-bg" x="${x}" y="30" width="256" height="496" rx="3"/><path class="zone-rule" d="M${x} 81h256m-256 438h256"/><text class="zone-no" x="${x+13}" y="51">0${i+1} / ${en}</text><text class="zone-title" x="${x+13}" y="71">${name}</text><path class="calibration" d="M${x+9} 93v-5h5m232 0h5v5m0 417v5h-5m-232 0h-5v-5"/></g>`;
 }).join('');
}
function objectNode(d,x,y,ports){
 const body=`M0 0H207L220 13V76H0Z`;
 return `<g class="object ${d.kind}" data-object="${d.id}" tabindex="0" role="button" aria-label="${esc(d.name)}，${esc(d.hint)}" aria-pressed="false" transform="translate(${x} ${y})">
 <path class="focus-ring" d="M-4 -4H208L224 11V80H-4Z"/><path class="slab" d="${body}"/><path class="fold" d="M207 0v13h13"/>
 <rect class="tile" x="11" y="13" width="33" height="35" rx="3"/><path class="glyph" transform="translate(17 20) scale(.87)" d="${shapes[d.icon]}"/>
 <text class="name ${d.name.length>=16?'long':''}" x="53" y="33">${esc(d.name)}</text><text class="hint" x="12" y="63">${esc(d.hint)}</text>
 ${layerMark(d.kind,185,57)}<text class="node-id" x="212" y="65">${d.num}</text>
 ${ports.map(([cx,cy])=>`<circle class="port" cx="${cx-x}" cy="${cy-y}" r="2.6"/>`).join('')}
 </g>`;
}
function endpoint(d,first){
 const nums=[...d.matchAll(/([MHV])([^MHV]+)/g)];
 let x,y;
 for(const [,cmd,str] of (first?nums.slice(0,1):nums)){
   const [a,b]=str.trim().split(/\s+/).map(Number);
   if(cmd==='M'){x=a;y=b;}else if(cmd==='H')x=a;else y=a;
 }
 return [x,y];
}
function mapMarkup(view) {
 const chart=charts[view], ports={};
 const edges=links.filter(x=>x.routes[view]).map(e=>{
   const [d,x,y]=e.routes[view], cl=e.kind==='context'?'context':'';
   (ports[e.a]??=[]).push(endpoint(d,true)); (ports[e.b]??=[]).push(endpoint(d,false));
   return `<path class="edge ${cl}" data-edge="${e.a}:${e.b}" d="${d}" marker-end="url(#${cl?'arrowContext':'arrow'})"/><text class="edge-label ${cl}" data-edge="${e.a}:${e.b}" x="${x}" y="${y}">${esc(e.label)}</text>`;
 }).join('');
 return `<div class="scene"><svg class="map" viewBox="0 0 960 555" role="group" aria-label="${chart.title}">
 ${defs}${zonesFor(chart)}
 <path class="calibration" d="M14 540h932 M14 536v8m169-8v8m169-8v8m169-8v8m169-8v8m169-8v8m87-8v8"/>
 <text class="coord" x="14" y="20">AX / ${chart.n}</text><text class="coord" x="946" y="20" text-anchor="end">RELATIONSHIP PLATE</text>
 ${edges}${Object.entries(chart.pos).map(([id,[col,row]])=>objectNode(items[id],...pos(col,row),ports[id]??[])).join('')}
 </svg></div>`;
}
function traceCard(id,x,y,w=151){
 const [title,sub]=steps[id], loss=['loss','nUnknown','refused','stopped'].includes(id);
 return `<g class="trace-card" role="button" tabindex="0" aria-label="${esc(title+'，'+sub)}" aria-pressed="false" data-step="${id}" transform="translate(${x} ${y})">
  <path class="slab" d="M0 0H${w-10}l10 10v44H0z"/><text class="name ${loss?'loss-name':''}" x="9" y="21">${esc(title)}</text><text class="hint" x="9" y="41">${esc(sub)}</text></g>`;
}
function traceEdge(a,b,poly,loss=false){
 return `<path class="trace-edge ${loss?'is-loss':''}" data-route="${a}:${b}" d="${poly}" marker-end="url(#${loss?'arrowContext':'arrow'})"/>`;
}
function receiptMarkup(){
 return `<div class="scene receipt-scene" data-block="ReceiptLens">
 <div class="receipt-controls" aria-label="回执情形">${Object.entries(branch).map(([v,b])=>`<button data-branch="${v}" aria-pressed="false">${b.label}</button>`).join('')}</div>
 <div class="receipt-scroll" tabindex="0" aria-label="可滚动回执路径"><svg class="map" viewBox="0 0 960 388" role="group" aria-label="调用端证据与原生操作状态">
 ${defs}
 <rect x="1" y="1" width="958" height="235" class="zone-bg" rx="3"/><rect x="1" y="247" width="958" height="139" class="zone-bg" rx="3"/>
 <text class="zone-no" x="14" y="21">A / CALLER KNOWLEDGE</text><text class="zone-title" x="14" y="44">调用端证据</text>
 <text class="zone-no" x="14" y="269">B / NATIVE JOURNAL</text><text class="zone-title" x="14" y="292">原生操作状态</text>
 ${traceEdge('prepare','send','M168 120H202')}
 ${traceEdge('send','loss','M353 120H374V75H393',true)}
 ${traceEdge('send','accepted','M353 120H374V145H393')}
 ${traceEdge('send','refused','M353 120H374V207H393',true)}
 ${traceEdge('loss','lookup','M544 75H579',true)}
 ${traceEdge('lookup','read','M756 75H765V120H779')}
 ${traceEdge('accepted','read','M544 145H761V133H779')}
 ${traceEdge('read','stopped','M862 147V180',true)}
 ${traceCard('prepare',17,93)}${traceCard('send',202,93)}${traceCard('loss',393,48)}${traceCard('accepted',393,118)}${traceCard('refused',393,180)}${traceCard('lookup',579,48,177)}${traceCard('read',779,93,166)}${traceCard('stopped',779,180,166)}
 ${traceEdge('nAccepted','nRunning','M149 343H177')}
 ${traceEdge('nRunning','nSucceeded','M305 343H369V318H400')}
 ${traceEdge('nRunning','nFailed','M305 343H355V359H577')}
 ${traceEdge('nRunning','nUnknown','M305 343H347V379H738V349H772',true)}
 ${traceEdge('nAccepted','nUnknown','M136 316V283H840V316',true)}
 ${traceCard('nAccepted',21,316,128)}${traceCard('nRunning',177,316,128)}${traceCard('nSucceeded',400,291,152)}${traceCard('nFailed',577,316,142)}${traceCard('nUnknown',772,316,167)}
 </svg></div><div class="receipt-note" id="receiptNote" aria-live="polite"></div>
 </div>`;
}
const detailTabs={fields:'属性',methods:'方法',sources:'源码'};
const currentFields=items.agent.fields;
const stoppedFields=[
 ['scope','原监听器、原生作用域与原代次'],
 ['name','历史参与者名'],
 ['stopped_event','stopped：精确停止事件，不用当前 incarnation'],
 ['membership','只读取停止记录中的采用事实；缺失不回填'],
 ['facts.labels','历史可缺失；不能用同名后继填补'],
 ['checkpoint','独立于后继的精确消息游标']
];
function say(str){$('announce').textContent=str;}
function drawNav(){
 $('nav').innerHTML=Object.entries(charts).map(([k,c])=>`<button data-view="${k}" class="${k==='receipt'?'receipt-tab':''}" ${k===state.view?'aria-current="page"':''}>${ico(c.icon)}${c.tab}</button>`).join('');
}
function saySelection(){say(`已选 ${items[state.id].name} · ${charts[state.view].title}`);}
function paintCanvas({center=false}={}){
 const c=charts[state.view], isReceipt=state.view==='receipt';
 $('mapId').innerHTML=`<b>${c.n}</b>${c.title}`;
 $('focusMode').hidden=isReceipt;
 $('focusMode').style.display=isReceipt?'none':'';
 $('focusMode').setAttribute('aria-pressed',String(state.focus));
 $('legend').innerHTML=isReceipt?'<span><i class="line"></i> 观察或状态路径</span><span><i class="line dashed"></i> 拒绝 / 不确定 / 停止</span><span class="mobile-hint">横滑以查看完整路径 ↔</span>':
 `<span><i class="mark ts"></i> TS 对象层</span><span><i class="mark http"></i> HTTP / SDK</span><span><i class="mark native"></i> 原生 / 上下文</span><span><i class="line"></i> 对象关系</span><span><i class="line dashed"></i> 上下文关系</span><span class="mobile-hint">横滑画布 ↔</span>`;
 $('mobileZones').innerHTML=isReceipt?'':c.zones.map(([label],i)=>`<button data-zone="${i}"><b>0${i+1}</b>${label}</button>`).join('');
 $('pane').classList.toggle('receipt-pane',isReceipt);
 $('pane').innerHTML=isReceipt?receiptMarkup():mapMarkup(state.view);
 $('pane').scrollTop=0;
 if(isReceipt)paintTrace();else{paintSelection();if(center)centerNode();}
}
function paintSelection(){
 const nearby=new Set(links.flatMap(e=>e.a===state.id?[e.b]:e.b===state.id?[e.a]:[]));
 for(const n of $('pane').querySelectorAll('[data-object]')){
   const id=n.dataset.object, selected=id===state.id, near=nearby.has(id);
   n.classList.toggle('is-selected',selected);
   n.classList.toggle('is-near',state.focus&&near);
   n.classList.toggle('is-muted',state.focus&&!near&&!selected);
   n.setAttribute('aria-pressed',String(selected));
 }
 for(const n of $('pane').querySelectorAll('[data-edge]')){
   const active=n.dataset.edge.split(':').includes(state.id);
   n.classList.toggle('is-hot',active);
   n.classList.toggle('is-muted',state.focus&&!active);
 }
}
function centerNode(){
 const pane=$('pane'), node=pane.querySelector(`[data-object="${state.id}"]`);
 if(!node||pane.scrollWidth<=pane.clientWidth)return;
 const a=node.getBoundingClientRect(), b=pane.getBoundingClientRect();
 pane.scrollLeft+=a.left-b.left+a.width/2-b.width/2;
}
function paintTrace(){
 const br=branch[state.branch];
 $('pane').querySelectorAll('[data-branch]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.branch===state.branch)));
 $('pane').querySelectorAll('[data-step]').forEach(el=>{
    const s=el.dataset.step;
    el.classList.toggle('is-active',s===state.step);
    el.classList.toggle('is-route',br.route.includes(s));
    el.setAttribute('aria-pressed',String(s===state.step));
 });
 $('pane').querySelectorAll('[data-route]').forEach(el=>{
   const [a,b]=el.dataset.route.split(':');
   el.classList.toggle('is-active',br.route.includes(a)&&br.route.includes(b));
 });
 const [title,sub,,note]=steps[state.step];
 $('receiptNote').innerHTML=`<strong>${esc(title)} · ${esc(sub)}</strong><span>${esc(note)}</span>`;
}
function related(d){
 const list=links.filter(e=>e.a===d.id||e.b===d.id);
 if(!list.length)return '';
 return `<h3>关联对象 <span>${list.length}</span></h3>`+list.map(e=>{
   const out=e.a===d.id, target=items[out?e.b:e.a];
   return `<button class="jump" data-jump="${target.id}" title="${out?'指向':'来自'} ${esc(target.name)}：${esc(e.label)}"><i class="mark ${target.kind}"></i><strong>${target.name}</strong><em>${out?'→':'←'} ${esc(e.label)}</em>${ico('arrow')}</button>`;
 }).join('');
}
function paintInspector({scroll=false}={}){
 const d=items[state.id],stopped=d.id==='agent'&&state.variant==='stopped';
 $('ordinal').textContent='OBJ / '+d.num;
 $('inspectorTitle').innerHTML=`<div class="identity-kind"><i class="mark ${d.kind}"></i>${d.id==='paging'?'延后覆盖':kinds[d.kind]}</div><h2 id="selectedTitle" tabindex="-1">${d.name}</h2><p>${esc(d.summary)}</p>`+
   (d.id==='agent'?`<div class="variants" aria-label="精确 Agent 变体"><button data-variant="current" aria-pressed="${!stopped}">Current</button><button data-variant="stopped" aria-pressed="${stopped}">Stopped</button></div>`:'');
 $('detailTabs').innerHTML=Object.entries(detailTabs).map(([k,label])=>`<button id="tab-${k}" role="tab" aria-selected="${state.tab===k}" aria-controls="detail" tabindex="${state.tab===k?0:-1}" data-tab="${k}">${label}</button>`).join('');
 $('detail').setAttribute('aria-labelledby','tab-'+state.tab);
 if(state.tab==='fields'){
   const fields=d.id==='agent'?(stopped?stoppedFields:currentFields):d.fields;
   $('detail').innerHTML=`<dl class="rows">${fields.map(([key,meaning])=>`<div><dt>${esc(key)}</dt><dd>${esc(meaning)}</dd></div>`).join('')}</dl>`;
 }else if(state.tab==='methods'){
   const methods=stopped?d.methods.slice(0,2):d.methods;
   $('detail').innerHTML=methods.map(([sig,meaning])=>`<div class="method"><code>${esc(sig)}</code><p>${esc(meaning)}</p></div>`).join('')+
   (d.note||stopped?`<p class="no-method">${esc(d.note||'StoppedAgent 只读，没有 prepareMessage 或 send。')}</p>`:'')+
   (d.id==='operation'?'<button class="mini-link" data-view="receipt">查看原回执路径 ↗</button>':'');
 }else{
   $('detail').innerHTML=d.sources.map(([file,line,symbol],i)=>{
     const path=paths[file]+':'+line;
     return `<div class="source"><div class="source-line"><code>${esc(path)}</code><button class="tool" data-copy="${i}" aria-label="复制 ${esc(symbol)} 源码位置" title="复制源码位置">${ico('copy')}</button></div><p>${esc(symbol)}</p></div>`;
   }).join('');
 }
 $('neighbors').innerHTML=related(d);
 if(scroll)$('detailScroll').scrollTop=0;
}
function activateView(view){
 const c=charts[view];
 if(!c)return;
 if(state.view===view)return;
 state.view=view;
 if(view==='receipt'){state.step=branch[state.branch].at;state.id=steps[state.step][2];}
 else if(!c.pos[state.id])state.id=c.home;
 state.tab='fields';
 drawNav();paintCanvas({center:true});paintInspector({scroll:true});saySelection();
}
function reset(){
 Object.assign(state,{view:'core',id:'agent',tab:'fields',variant:'current',focus:false,branch:'lost',step:'lookup'});
 drawNav();paintCanvas({center:true});paintInspector({scroll:true});saySelection();
}
function selectObject(id,{fromSearch=false,jump=false}={}){
 if(!items[id])return;
 const c=charts[state.view];
 let newView=false;
 if(!c.pos?.[id]){
    state.view=Object.keys(charts).find(view=>charts[view].pos?.[id]);
    newView=true;
 }
 state.id=id;state.tab='fields';
 if(newView){drawNav();paintCanvas({center:true});}else{paintSelection();if(fromSearch||jump)centerNode();}
 paintInspector({scroll:true});saySelection();
 if(fromSearch){
    const node=$('pane').querySelector(`[data-object="${id}"]`);
    node?.focus({preventScroll:true});
 }
 if(jump)$('selectedTitle').focus({preventScroll:true});
}
function setStep(step){
 if(!steps[step])return;
 state.step=step;state.id=steps[step][2];state.tab='fields';
 paintTrace();paintInspector({scroll:true});saySelection();
}
function openSearch(){
 if($('searchDialog').open)return;
 $('query').value='';searchIndex=0;
 $('searchDialog').showModal();drawSearch();$('query').focus();
}
const normalize=s=>s.toLowerCase().replace(/\s+/g,' ').trim();
let resultIds=[],searchIndex=0;
function matches(d,parts){
 const name=normalize(d.name), key=normalize(d.id+' '+d.hint);
 const secondary=normalize([d.summary,kinds[d.kind],d.note,...d.fields.flat(),...(d.id==='agent'?stoppedFields.flat():[]),...d.methods.flat(),...d.sources.map(row=>row[2])].join(' '));
 if(!parts.every(p=>name.includes(p)||key.includes(p)||secondary.includes(p)))return -1;
 return parts.reduce((total,p)=>total+(name===p?12:name.startsWith(p)?8:name.includes(p)?5:key.includes(p)?3:1),0);
}
function drawSearch(){
 const parts=normalize($('query').value).split(' ').filter(Boolean);
 resultIds=Object.values(items).map(d=>[d.id,matches(d,parts)]).filter(x=>x[1]>=0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
 if(!parts.length)resultIds=[state.id,...resultIds.filter(id=>id!==state.id)];
 searchIndex=Math.max(0,Math.min(searchIndex,resultIds.length-1));
 $('results').innerHTML=resultIds.length?resultIds.map(id=>{
   const d=items[id];
   return `<li role="presentation"><button type="button" role="option" aria-selected="false" class="result" id="res-${id}" data-result="${id}" tabindex="-1"><i class="mark ${d.kind}"></i><strong>${d.name}</strong><span class="desc">${esc(d.hint)}</span></button></li>`;
 }).join(''):'<li class="empty" role="presentation">未找到匹配对象</li>';
 $('results').scrollTop=0;paintSearch(false);
 say(resultIds.length?`${resultIds.length} 个匹配对象`:'没有匹配项');
}
function paintSearch(keepVisible=true){
 const activeId=resultIds[searchIndex];
 $('results').querySelectorAll('[data-result]').forEach(el=>{
   const active=el.dataset.result===activeId;
   el.classList.toggle('hot',active);
   el.setAttribute('aria-selected',String(active));
 });
 if(!activeId){$('query').removeAttribute('aria-activedescendant');return;}
 $('query').setAttribute('aria-activedescendant','res-'+activeId);
 if(keepVisible)$('res-'+activeId).scrollIntoView({block:'nearest'});
}
function chooseResult(id){
 if(!id)return;
 $('searchDialog').close();
 selectObject(id,{fromSearch:true});
}
async function copySource(button){
 const d=items[state.id], [f,line]=d.sources[Number(button.dataset.copy)];
 const value=paths[f]+':'+line;
 try{
   if(!navigator.clipboard)throw new Error('clipboard unavailable');
   await navigator.clipboard.writeText(value);say('已复制 '+value);button.textContent='已复制';
 }catch{
   const source=button.closest('.source');
   let input=source.querySelector('textarea');
   if(!input){input=document.createElement('textarea');input.readOnly=true;input.setAttribute('aria-label','源码路径，按 Ctrl+C 复制');source.append(input);}
   input.value=value;input.focus();input.select();say('已选中源码位置，可手动复制');
 }
}
$('searchOpen').innerHTML=`${ico('search')}<span>查找对象</span><kbd>/</kbd>`;
$('searchIcon').innerHTML=ico('search');$('railIcon').innerHTML=ico('inspect');
$('focusMode').innerHTML=ico('focus')+'邻域聚焦';$('overview').innerHTML=ico('overview')+'总览';
$('searchOpen').addEventListener('click',openSearch);
$('searchClose').addEventListener('click',()=>{$('searchDialog').close();$('searchOpen').focus();});
$('searchDialog').addEventListener('cancel',()=>requestAnimationFrame(()=>$('searchOpen').focus()));
$('query').addEventListener('input',()=>{searchIndex=0;drawSearch();});
$('query').addEventListener('keydown',e=>{
 if(['ArrowUp','ArrowDown','Home','End'].includes(e.key)&&resultIds.length){
   e.preventDefault();
   searchIndex=e.key==='Home'?0:e.key==='End'?resultIds.length-1:(searchIndex+(e.key==='ArrowDown'?1:resultIds.length-1))%resultIds.length;
   paintSearch();
 }
});
$('searchForm').addEventListener('submit',e=>{e.preventDefault();chooseResult(resultIds[searchIndex]);});
$('results').addEventListener('click',e=>chooseResult(e.target.closest('[data-result]')?.dataset.result));
$('overview').addEventListener('click',reset);
$('inspectorJump').innerHTML=ico('inspect')+'检查';
$('inspectorJump').addEventListener('click',()=>{
 const title=$('selectedTitle');title.focus({preventScroll:true});title.scrollIntoView({block:'center'});
});
$('mobileZones').addEventListener('click',e=>{
 const zone=e.target.closest('[data-zone]')?.dataset.zone;
 if(zone===undefined)return;
 const p=$('pane'), m=p.querySelector('.map').getBoundingClientRect();
 p.scrollLeft+=m.left-p.getBoundingClientRect().left+((142+338*Number(zone))/960)*m.width-p.clientWidth/2;
});
$('focusMode').addEventListener('click',()=>{
 state.focus=!state.focus;$('focusMode').setAttribute('aria-pressed',String(state.focus));paintSelection();
 say(state.focus?'突出直接关系':'已显示完整关系');
});
$('nav').addEventListener('click',e=>{
 const v=e.target.closest('[data-view]')?.dataset.view;
 if(v){activateView(v);$('nav').querySelector(`[data-view="${v}"]`)?.focus({preventScroll:true});}
});
$('pane').addEventListener('click',e=>{
 const n=e.target.closest('[data-object],[data-step],[data-branch]');
 if(!n)return;
 if(n.dataset.object)selectObject(n.dataset.object);
 if(n.dataset.step)setStep(n.dataset.step);
 if(n.dataset.branch){state.branch=n.dataset.branch;setStep(branch[state.branch].at);}
});
$('pane').addEventListener('keydown',e=>{
 const n=e.target.closest('[data-object],[data-step]');
 if(n&&(e.key==='Enter'||e.key===' ')){
   e.preventDefault(); if(n.dataset.object)selectObject(n.dataset.object);else setStep(n.dataset.step);
 }
});
$('inspectorTitle').addEventListener('click',e=>{
 const v=e.target.dataset.variant;
 if(v){state.variant=v;paintInspector({scroll:true});$('inspectorTitle').querySelector(`[data-variant="${v}"]`).focus({preventScroll:true});say('Agent '+v);}
});
function setTab(tab){
 state.tab=tab;paintInspector({scroll:true});$('tab-'+tab).focus({preventScroll:true});
}
$('detailTabs').addEventListener('click',e=>{if(e.target.dataset.tab)setTab(e.target.dataset.tab);});
$('detailTabs').addEventListener('keydown',e=>{
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;
 e.preventDefault();
 const tabs=Object.keys(detailTabs), at=tabs.indexOf(state.tab);
 const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(at+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;
 setTab(tabs[next]);
});
$('detail').addEventListener('click',e=>{
 const copy=e.target.closest('[data-copy]'), view=e.target.closest('[data-view]')?.dataset.view;
 if(copy)copySource(copy);
 if(view){activateView(view);$('nav').querySelector(`[data-view="${view}"]`)?.focus({preventScroll:true});}
});
$('neighbors').addEventListener('click',e=>{
 const id=e.target.closest('[data-jump]')?.dataset.jump;
 if(id)selectObject(id,{jump:true});
});
document.addEventListener('keydown',e=>{
 if(e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey||$('searchDialog').open||e.target.closest('input,textarea,[contenteditable]'))return;
 if(e.key==='/'){e.preventDefault();openSearch();}
});
drawNav();paintCanvas({center:true});paintInspector();
</script>
</body>
</html>
