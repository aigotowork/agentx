<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>流程全景图</title>
    <style>:root {
  --atlas-bg: #f4f7fb;
  --atlas-surface: #ffffff;
  --atlas-surface-soft: #f8fafc;
  --atlas-line: #dce4ef;
  --atlas-line-strong: #c8d3e1;
  --atlas-ink: #172338;
  --atlas-muted: #66748a;
  --atlas-faint: #94a2b5;
  --atlas-accent: #2f6fed;
  --atlas-accent-soft: #e9f0ff;
  --atlas-teal: #0b8d83;
  --atlas-teal-soft: #e7f7f4;
  --atlas-amber: #bd7215;
  --atlas-amber-soft: #fff5e4;
  --atlas-red: #c64c55;
  --atlas-red-soft: #fff0f1;
  --atlas-purple: #7455bf;
  --atlas-purple-soft: #f2edff;
  --atlas-radius: 12px;
  --atlas-radius-small: 8px;
  --atlas-shadow: 0 12px 30px rgba(31, 53, 83, 0.07);
  --atlas-shadow-small: 0 4px 12px rgba(31, 53, 83, 0.09);
  --atlas-space-1: 4px;
  --atlas-space-2: 8px;
  --atlas-space-3: 12px;
  --atlas-space-4: 16px;
  --atlas-space-5: 20px;
  --atlas-space-6: 24px;
  --atlas-space-7: 32px;
  --atlas-map-label-size: 11px;
  --atlas-map-module-size: 12px;
  --atlas-map-kind-size: 10px;
  --atlas-diff-item-width: 320px;
  --atlas-handler: #0b8d83;
  --atlas-flow-glow: rgba(47, 111, 237, 0.18);
  --atlas-font: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --atlas-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  color: var(--atlas-ink);
  background: var(--atlas-bg);
  font-family: var(--atlas-font);
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

button, select { font: inherit; }
button { color: inherit; }

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.atlas-shell { min-height: 100vh; }

.atlas-header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: var(--atlas-space-6);
  padding: var(--atlas-space-5) clamp(var(--atlas-space-4), 4vw, 56px) var(--atlas-space-4);
  border-bottom: 1px solid var(--atlas-line);
  background: rgba(255, 255, 255, 0.92);
}

.atlas-heading { min-width: 0; }
.atlas-kicker, .panel-eyebrow {
  color: var(--atlas-accent);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.atlas-kicker { display: flex; align-items: center; gap: var(--atlas-space-2); }
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--atlas-teal); box-shadow: 0 0 0 4px var(--atlas-teal-soft); }
.atlas-heading h1 { margin: var(--atlas-space-2) 0 0; font-size: clamp(22px, 2vw, 30px); letter-spacing: -0.035em; line-height: 1.1; }
.atlas-scope { max-width: 720px; margin: var(--atlas-space-2) 0 0; color: var(--atlas-muted); font-size: 12px; }

.atlas-toolbar { display: flex; align-items: flex-end; justify-content: flex-end; gap: var(--atlas-space-3); flex-wrap: wrap; }
.control-field { display: grid; gap: var(--atlas-space-1); min-width: 154px; color: var(--atlas-muted); font-size: 11px; font-weight: 700; }
.control-field--scenario { min-width: 198px; }
.control-field select {
  width: 100%;
  height: 36px;
  padding: 0 30px 0 var(--atlas-space-3);
  border: 1px solid var(--atlas-line-strong);
  border-radius: var(--atlas-radius-small);
  color: var(--atlas-ink);
  background: var(--atlas-surface);
  cursor: pointer;
}
.control-field select:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 3px solid rgba(47, 111, 237, 0.28); outline-offset: 2px; }

.step-controls { display: flex; align-items: center; gap: var(--atlas-space-1); }
.icon-button, .play-button {
  border: 1px solid var(--atlas-line-strong);
  border-radius: var(--atlas-radius-small);
  background: var(--atlas-surface);
  cursor: pointer;
  transition: border-color 160ms ease, background 160ms ease, color 160ms ease, transform 160ms ease;
}
.icon-button { width: 36px; height: 36px; font-size: 19px; line-height: 1; }
.play-button { display: inline-flex; align-items: center; gap: var(--atlas-space-2); height: 36px; padding: 0 var(--atlas-space-3); color: var(--atlas-accent); font-size: 12px; font-weight: 800; }
.icon-button:hover, .play-button:hover { border-color: var(--atlas-accent); background: var(--atlas-accent-soft); }
.play-button[aria-pressed="true"] { color: var(--atlas-surface); border-color: var(--atlas-accent); background: var(--atlas-accent); }
.play-button__icon { font-size: 10px; }

.atlas-main { display: grid; gap: var(--atlas-space-4); width: min(100%, 1500px); margin: 0 auto; padding: var(--atlas-space-4) clamp(var(--atlas-space-4), 4vw, 56px) var(--atlas-space-5); }
.atlas-workspace { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(300px, 0.8fr); gap: var(--atlas-space-4); min-width: 0; }
.panel { min-width: 0; border: 1px solid var(--atlas-line); border-radius: var(--atlas-radius); background: var(--atlas-surface); box-shadow: var(--atlas-shadow); }
.map-panel, .inspector-panel, .step-panel, .facts-panel { overflow: hidden; }
.panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--atlas-space-4); padding: var(--atlas-space-4) var(--atlas-space-5) var(--atlas-space-3); }
.panel-heading--compact { padding-bottom: var(--atlas-space-3); }
.panel-heading h2 { margin: var(--atlas-space-1) 0 0; font-size: 16px; letter-spacing: -0.02em; }
.map-legend { display: flex; align-items: center; gap: var(--atlas-space-3); padding-top: var(--atlas-space-1); color: var(--atlas-muted); font-size: 11px; white-space: nowrap; }
.map-legend span { display: inline-flex; align-items: center; gap: var(--atlas-space-1); }
.legend-swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; border: 1px solid var(--atlas-line-strong); background: var(--atlas-surface-soft); }
.legend-swatch--logical { border-radius: 50%; background: var(--atlas-purple-soft); border-color: #d6c8ff; }
.legend-swatch--store { border-radius: 50%; background: var(--atlas-amber-soft); border-color: #f0d09e; }
.map-meta { display: flex; align-items: center; justify-content: space-between; gap: var(--atlas-space-4); padding: 0 var(--atlas-space-5) var(--atlas-space-3); color: var(--atlas-muted); font-size: 11px; }
.map-meta__hint { color: var(--atlas-faint); }

.atlas-map { min-height: 520px; max-height: 566px; overflow: auto; border-top: 1px solid var(--atlas-line); background: var(--atlas-surface-soft); scrollbar-color: var(--atlas-line-strong) transparent; }
.atlas-map svg { display: block; width: 100%; min-width: 920px; min-height: 520px; height: 100%; }
.atlas-map__empty { display: grid; place-items: center; min-height: 320px; color: var(--atlas-muted); }

.inspector-panel { display: flex; flex-direction: column; }
.inspector-context, .facts-badge, .step-counter { flex: 0 0 auto; max-width: 180px; padding: var(--atlas-space-1) var(--atlas-space-2); overflow: hidden; border-radius: 999px; color: var(--atlas-muted); background: var(--atlas-surface-soft); font-size: 10px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
.inspector-content { min-height: 0; padding: 0 var(--atlas-space-5) var(--atlas-space-5); overflow: auto; }
.inspector-empty { padding: var(--atlas-space-5) 0; color: var(--atlas-muted); }
.object-title { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: var(--atlas-space-3); padding: var(--atlas-space-2) 0 var(--atlas-space-3); border-bottom: 1px solid var(--atlas-line); }
.object-title h3 { margin: 0; font-size: 18px; letter-spacing: -0.025em; }
.object-kind { margin-top: var(--atlas-space-1); color: var(--atlas-muted); font-size: 11px; }
.tone-badge { max-width: 100%; padding: var(--atlas-space-1) var(--atlas-space-2); border-radius: var(--atlas-radius-small); font-size: 10px; font-weight: 800; white-space: normal; overflow-wrap: anywhere; }
.tone-badge--running { color: var(--atlas-teal); background: var(--atlas-teal-soft); }
.tone-badge--busy { color: var(--atlas-accent); background: var(--atlas-accent-soft); }
.tone-badge--waiting { color: var(--atlas-amber); background: var(--atlas-amber-soft); }
.tone-badge--stopped { color: var(--atlas-red); background: var(--atlas-red-soft); }
.tone-badge--stored { color: var(--atlas-amber); background: var(--atlas-amber-soft); }
.tone-badge--unknown { color: var(--atlas-purple); background: var(--atlas-purple-soft); }
.tone-badge--neutral { color: var(--atlas-muted); background: var(--atlas-surface-soft); }
.detail-list { display: grid; gap: var(--atlas-space-2); margin: var(--atlas-space-3) 0 0; }
.detail-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: var(--atlas-space-3); font-size: 12px; }
.detail-row dt { color: var(--atlas-muted); }
.detail-row dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
.mono { font-family: var(--atlas-mono); font-size: 11px; }
.inspector-section { margin-top: var(--atlas-space-4); }
.inspector-section h4 { margin: 0 0 var(--atlas-space-2); color: var(--atlas-muted); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.capability-list, .action-list, .source-list { display: grid; gap: var(--atlas-space-1); padding: 0; margin: 0; list-style: none; }
.capability-list li { position: relative; padding-left: var(--atlas-space-3); font-size: 12px; }
.capability-list li::before { position: absolute; top: 0.6em; left: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--atlas-accent); content: ""; }
.module-list { display: grid; gap: var(--atlas-space-2); }
.module-button { display: grid; gap: var(--atlas-space-1); width: 100%; padding: var(--atlas-space-2) var(--atlas-space-3); border: 1px solid var(--atlas-line); border-radius: var(--atlas-radius-small); text-align: left; background: var(--atlas-surface-soft); cursor: pointer; }
.module-button:hover, .module-button[aria-current="true"] { border-color: var(--atlas-accent); background: var(--atlas-accent-soft); }
.module-button__label { font-size: 12px; font-weight: 800; }
.module-button__path, .source-path { color: var(--atlas-muted); font-family: var(--atlas-mono); font-size: 10px; overflow-wrap: anywhere; }
.source-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: var(--atlas-space-2); padding: var(--atlas-space-2) 0; border-top: 1px solid var(--atlas-line); }
.source-item__main { min-width: 0; display: grid; gap: var(--atlas-space-1); }
.source-item__label { font-size: 11px; font-weight: 800; }
.source-item__basis { color: var(--atlas-muted); font-size: 10px; }
.copy-button { padding: var(--atlas-space-1) var(--atlas-space-2); border: 1px solid var(--atlas-line); border-radius: 6px; color: var(--atlas-accent); background: var(--atlas-surface); font-size: 10px; cursor: pointer; }
.copy-button:hover { border-color: var(--atlas-accent); background: var(--atlas-accent-soft); }
.copy-feedback { min-height: 16px; margin: var(--atlas-space-2) 0 0; color: var(--atlas-teal); font-size: 10px; }

.atlas-lower { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(320px, 0.55fr); gap: var(--atlas-space-4); }
.step-content { padding: 0 var(--atlas-space-5) var(--atlas-space-5); }
.step-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--atlas-space-4); }
.step-title { margin: var(--atlas-space-1) 0 0; font-size: 20px; letter-spacing: -0.03em; }
.step-event { flex: 0 0 auto; color: var(--atlas-accent); font-family: var(--atlas-mono); font-size: 11px; }
.step-context { display: flex; flex-wrap: wrap; gap: var(--atlas-space-2); margin-top: var(--atlas-space-3); }
.context-chip { display: inline-flex; align-items: center; gap: var(--atlas-space-1); padding: var(--atlas-space-1) var(--atlas-space-2); border-radius: 6px; color: var(--atlas-muted); background: var(--atlas-surface-soft); font-size: 11px; }
.context-chip strong { color: var(--atlas-ink); font-weight: 800; }
.context-chip--accent { color: var(--atlas-accent); background: var(--atlas-accent-soft); }
.action-list { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: var(--atlas-space-4); }
.action-list li { min-height: 42px; padding: var(--atlas-space-2) var(--atlas-space-3); border: 1px solid var(--atlas-line); border-radius: var(--atlas-radius-small); color: var(--atlas-ink); background: var(--atlas-surface-soft); font-size: 12px; }
.step-note { margin: var(--atlas-space-4) 0 0; padding: var(--atlas-space-3); border-left: 3px solid var(--atlas-amber); color: #785019; background: var(--atlas-amber-soft); font-size: 12px; }
.step-note strong { display: block; margin-bottom: var(--atlas-space-1); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.step-empty { min-height: 132px; display: grid; align-content: center; gap: var(--atlas-space-2); color: var(--atlas-muted); }
.step-empty strong { color: var(--atlas-ink); font-size: 14px; }

.facts-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--atlas-space-2); padding: 0 var(--atlas-space-5) var(--atlas-space-5); }
.fact-card { min-width: 0; padding: var(--atlas-space-3); border: 1px solid var(--atlas-line); border-radius: var(--atlas-radius-small); background: var(--atlas-surface-soft); }
.fact-card--wide { grid-column: span 2; }
.fact-label { color: var(--atlas-muted); font-size: 10px; font-weight: 800; }
.fact-value { margin-top: var(--atlas-space-1); color: var(--atlas-ink); font-size: 12px; font-weight: 700; overflow-wrap: anywhere; }
.atlas-footer { display: flex; justify-content: space-between; gap: var(--atlas-space-4); padding: 0 clamp(var(--atlas-space-4), 4vw, 56px) var(--atlas-space-5); color: var(--atlas-faint); font-size: 10px; }
.atlas-footer span:first-child { color: var(--atlas-muted); }

/* Inline SVG map */
.map-edge { cursor: pointer; }
.map-edge__hit { fill: none; stroke: transparent; stroke-width: 14; }
.map-edge__line { fill: none; stroke: #b7c5d8; stroke-width: 1.5; marker-end: url(#edge-arrow); transition: stroke 160ms ease, stroke-width 160ms ease; }
.map-edge__label-bg { fill: rgba(248, 250, 252, 0.94); stroke: #e4eaf2; stroke-width: 1; }
.map-edge__label { fill: #607087; font-family: var(--atlas-font); font-size: var(--atlas-map-label-size); pointer-events: none; }
.map-edge:hover .map-edge__line, .map-edge.is-selected .map-edge__line, .map-edge.is-active .map-edge__line { stroke: var(--atlas-accent); stroke-width: 3; }
.map-edge.is-active .map-edge__label-bg { fill: var(--atlas-accent-soft); stroke: #c9d9ff; }
.map-edge.is-active .map-edge__label { fill: var(--atlas-accent); font-weight: 800; }
.map-node { cursor: pointer; }
.map-node__body { fill: var(--atlas-surface); stroke: var(--atlas-line-strong); stroke-width: 1.4; filter: drop-shadow(0 3px 4px rgba(31, 53, 83, 0.06)); transition: stroke 160ms ease, stroke-width 160ms ease, fill 160ms ease; }
.map-node__head { fill: #f3f6fa; }
.map-node__title { fill: var(--atlas-ink); font-family: var(--atlas-font); font-size: 13px; font-weight: 800; }
.map-node__kind { fill: var(--atlas-muted); font-family: var(--atlas-font); font-size: var(--atlas-map-kind-size); }
.map-node__state { fill: var(--atlas-muted); font-family: var(--atlas-font); font-size: var(--atlas-map-label-size); }
.map-node__module { cursor: pointer; }
.map-node__module-bg { fill: var(--atlas-surface-soft); stroke: #e4eaf2; stroke-width: 1; }
.map-node__module:hover .map-node__module-bg, .map-node__module.is-selected .map-node__module-bg { fill: var(--atlas-accent-soft); stroke: #a9c2ff; }
.map-node__module-label { fill: #334157; font-family: var(--atlas-font); font-size: var(--atlas-map-module-size); font-weight: 700; pointer-events: none; }
.map-node.is-selected .map-node__body, .map-node.is-active .map-node__body { stroke: var(--atlas-accent); stroke-width: 2.5; }
.map-node.is-active .map-node__head { fill: var(--atlas-accent-soft); }
.map-node.is-active .map-node__title { fill: var(--atlas-accent); }
.map-node--logical .map-node__body { fill: var(--atlas-purple-soft); stroke: #d8cdf6; }
.map-node--store .map-node__body { fill: var(--atlas-amber-soft); stroke: #efd4a6; }
.map-node--logical .map-node__head, .map-node--store .map-node__head { fill: transparent; }
.map-node--process-group .map-node__body { stroke-dasharray: 5 3; }
.map-node__state-dot { stroke: var(--atlas-surface); stroke-width: 1; }
.state-dot--running { fill: var(--atlas-teal); }
.state-dot--busy { fill: var(--atlas-accent); }
.state-dot--waiting { fill: var(--atlas-amber); }
.state-dot--stopped { fill: var(--atlas-red); }
.state-dot--stored { fill: var(--atlas-amber); }
.state-dot--unknown { fill: var(--atlas-purple); }
.state-dot--neutral { fill: #9aa8ba; }

/* Finite explanatory event playback; animation time is never runtime evidence. */
.disclosure-button { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; min-height: 28px; padding: 3px 8px; border: 1px solid var(--atlas-line); border-radius: 6px; color: var(--atlas-accent); background: var(--atlas-surface); font-size: 11px; cursor: pointer; }
.disclosure-button:hover, .disclosure-button[aria-expanded="true"] { border-color: var(--atlas-accent); background: var(--atlas-accent-soft); }
button:disabled { opacity: 0.45; cursor: default; }
.event-phase { display: inline-flex; align-items: center; flex: 0 0 auto; min-height: 24px; padding: 2px 7px; border-radius: 6px; color: var(--atlas-accent); background: var(--atlas-accent-soft); font-size: 10px; font-weight: 800; white-space: nowrap; }
.event-phase[data-phase="applied"] { color: var(--atlas-teal); background: var(--atlas-teal-soft); }
.event-phase[data-beat-kind="disconnect"] { color: var(--atlas-red); background: var(--atlas-red-soft); }
.event-phase[data-phase="ready"] { color: var(--atlas-muted); background: var(--atlas-surface-soft); }
.state-diff { display: flex; align-items: center; min-height: 28px; min-width: 0; gap: var(--atlas-space-1); overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; overscroll-behavior: contain; }
.state-diff__phase, .state-diff__empty { flex: 0 0 auto; color: var(--atlas-muted); font-size: 10px; }
.state-diff__phase { position: sticky; left: 0; z-index: 1; padding-right: var(--atlas-space-1); background: var(--atlas-surface); }
.state-diff__item { justify-content: flex-start; max-width: var(--atlas-diff-item-width); min-height: 26px; gap: var(--atlas-space-1); padding: 2px 6px; color: var(--atlas-ink); font-size: 10px; }
.state-diff__label { flex: 0 1 auto; max-width: 100px; }
.state-diff__before, .state-diff__after, .state-diff__label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.state-diff__before { flex: 1 1 70px; max-width: 100px; color: var(--atlas-muted); }
.state-diff__after { flex: 1 1 90px; max-width: 130px; color: var(--atlas-accent); }
.state-diff__arrow { color: var(--atlas-muted); }
.state-diff[data-applied="true"] .state-diff__after { color: var(--atlas-teal); font-weight: 700; }
.state-diff[data-applied="false"] .state-diff__after { text-decoration: underline dotted; text-underline-offset: 3px; }
.fact-card:hover { background: var(--atlas-accent-soft); }
.fact-card.is-changed { box-shadow: inset 0 2px var(--atlas-accent); }
.facts-grid[data-phase="applied"] .fact-card.is-changed { background: var(--atlas-teal-soft); box-shadow: inset 0 2px var(--atlas-teal); }
.change-detail { padding: var(--atlas-space-3) 0; border-bottom: 1px solid var(--atlas-line); }
.change-detail h4 { margin: 0; font-size: 12px; }
.fact-current { font-size: 12px; }
.beat-list { display: grid; gap: var(--atlas-space-2); margin: var(--atlas-space-3) 0; padding-left: var(--atlas-space-5); font-size: 12px; }
.beat-list [aria-current="step"] { color: var(--atlas-accent); font-weight: 800; }
.map-node.is-changed .map-node__body { stroke: var(--atlas-teal); stroke-width: 3; }
.map-node.is-changed .map-node__state { fill: var(--atlas-teal); font-weight: 800; }
.map-node.is-handler .map-node__body { stroke: var(--atlas-handler); stroke-width: 3; }
.map-node__role { font: 700 10px var(--atlas-font); fill: var(--atlas-accent); }
.map-node.is-handler .map-node__role { fill: var(--atlas-handler); }
.map-edge.is-broken .map-edge__line { stroke: var(--atlas-red); stroke-width: 2.5; stroke-dasharray: 6 5; marker-end: none; }
.map-edge.is-broken .map-edge__label { fill: var(--atlas-red); }
.event-break, .event-flow { pointer-events: none; }

  function updateFlowMarker() {

    if (disclosure.kind === "calls") {
      refs.inspectorContext.textContent = eventPhase() === "applied" ? "结果已知" : "尚未应用";
      currentCalls().forEach(function (call) { refs.inspector.appendChild(FlowAtlasPorts.showCall(call, callStatus(call), callUI())); });
      return;
    }
    if (disclosure.kind === "event") {
      refs.inspectorContext.textContent = "行为演示";
      refs.inspector.appendChild(renderEventInspector());
      return;
    }
    if (disclosure.kind === "changes" || disclosure.kind === "fact") {
      refs.inspectorContext.textContent = eventPhase() === "applied" ? "已应用" : "待应用";
      refs.inspector.appendChild(renderChangesInspector());
      return;
    }
    if (currentModule && currentNode) {
      refs.inspectorContext.textContent = "模块";
      refs.inspector.appendChild(renderModuleInspector(currentNode, currentModule));
    } else if (currentEdge) {
      refs.inspectorContext.textContent = "通道";
      refs.inspector.appendChild(renderEdgeInspector(currentEdge));
    } else if (currentNode) {
      refs.inspectorContext.textContent = kindLabels[currentNode.kind] || "对象";
      refs.inspector.appendChild(renderNodeInspector(currentNode, visibleState()));
    } else {
      refs.inspectorContext.textContent = "未选择";
      refs.inspector.appendChild(element("div", "inspector-empty", "选择地图中的对象查看它的边界、能力和来源。"));
    }
  }

  function renderEventInspector() {
    var wrapper = element("div", "event-details");
    var step = currentStep();
    var currentScenario = scenario();
    wrapper.appendChild(element("h3", "step-title", step ? step.title : (currentScenario && currentScenario.label || "选择一个场景")));
    if (!step) {
      wrapper.appendChild(element("p", "detail-description", currentScenario && currentScenario.question || ""));
      return wrapper;
    }
    var details = element("dl", "detail-list");
    appendDetailRow(details, "事件", step.event, "mono");
    appendDetailRow(details, "动作方", labelFor(step.actor));
    appendDetailRow(details, "处理方", labelFor(step.handler));
    if (step.certainty) appendDetailRow(details, "依据", step.certainty);
    wrapper.appendChild(details);
    var beats = element("ol", "beat-list");
    beatsFor(step).forEach(function (beat, index) {
      var item = element("li", "", beatLabels[beat.kind] + " · " + beat.label);
      if (transition && transition.phase === "flow" && index === transition.beatIndex) item.setAttribute("aria-current", "step");
      beats.appendChild(item);
    });
    wrapper.appendChild(beats);
    var actions = element("ul", "action-list");
    array(step.actions).forEach(function (action) { actions.appendChild(element("li", "", action)); });
    wrapper.appendChild(actions);
    currentCalls().forEach(function (call) { wrapper.appendChild(FlowAtlasPorts.showCall(call, callStatus(call), callUI())); });
    if (step.note) wrapper.appendChild(element("aside", "step-note", step.note));
    appendSourceList(wrapper, step.sourceIds);
    return wrapper;
  }

  function renderChangesInspector() {
    var wrapper = element("div", "changes-details");
    var changes = changesForStep();
    var visible = visibleState();
    if (disclosure.kind === "fact") {
      wrapper.appendChild(element("h3", "step-title", factLabels[disclosure.key] || "状态"));
      wrapper.appendChild(element("p", "fact-current", "当前 · " + (visible.facts[disclosure.key] || "未提供")));
      changes = changes.filter(function (change) { return change.kind === "fact" && change.id === disclosure.key; });
    }
    if (!changes.length) wrapper.appendChild(element("p", "detail-description", "本步骤未改写此处事实。"));
    changes.forEach(function (change) {
      var section = element("section", "change-detail");
      section.appendChild(element("h4", "", change.label));
      var values = element("dl", "detail-list");
      appendDetailRow(values, "之前", change.before);
      appendDetailRow(values, eventPhase() === "applied" ? "之后" : "待应用", change.after);
      section.appendChild(values);
      wrapper.appendChild(section);
    });
    return wrapper;
  }

  function disclosureButton(text, testId, kind, key) {
    var button = element("button", "disclosure-button", text);
    button.type = "button";
    if (testId) button.setAttribute("data-testid", testId);
    button.setAttribute("aria-controls", "inspector");
    button.setAttribute("data-disclosure-kind", kind);
    button.setAttribute("data-disclosure-key", key || "");
    button.setAttribute("aria-expanded", String(disclosure.open && disclosure.kind === kind && disclosure.key === (key || null)));
    button.addEventListener("click", function () { openDisclosure(kind, key, button); });
    return button;
  }

  function renderStep() {
    var previousDiff = refs.step.querySelector('[data-testid="state-diff"]');
    var diffScroll = previousDiff ? previousDiff.scrollLeft : 0;
    var currentScenario = scenario();
    var steps = array(currentScenario && currentScenario.steps);
    var step = currentStep();
    var preview = step || steps[0];
    refs.step.replaceChildren();
    refs.stepCounter.textContent = (state.stepIndex < 0 ? "开始" : (state.stepIndex + 1) + " / " + steps.length);
    refs.previous.disabled = state.stepIndex < 0;
    refs.next.disabled = !steps.length || state.stepIndex >= steps.length - 1;
    var titleRow = element("div", "step-title-row");
    var title = element("h3", "step-title", step ? step.title : (preview ? "下一步 · " + preview.title : "选择一个场景"));
    title.title = title.textContent;
    titleRow.appendChild(title);
    var phase = element("span", "event-phase");
    phase.setAttribute("data-testid", "event-phase");
    phase.setAttribute("data-phase", eventPhase());
    phase.setAttribute("role", "status");
    phase.setAttribute("aria-live", "polite");
    var beat = currentBeat();
    phase.setAttribute("data-beat-kind", beat ? beat.kind : "");
    var phaseText = beat ? beatLabels[beat.kind] + " " + (transition.beatIndex + 1) + "/" + transition.beats.length : phaseLabels[eventPhase()];
    phase.textContent = "行为演示 · " + phaseText + (transition && !state.playing && eventPhase() !== "applied" ? " · 已暂停" : "");
    titleRow.appendChild(phase);
    var replay = element("button", "disclosure-button event-replay", "↻ 重播");
    replay.type = "button";
    replay.disabled = !step;
    replay.setAttribute("data-testid", "event-replay");
    replay.setAttribute("aria-label", "重播当前事件");
    replay.addEventListener("click", function () { setStep(state.stepIndex, false, true, false); });
    titleRow.appendChild(replay);
    titleRow.appendChild(disclosureButton("ⓘ 详情", "event-details", "event"));
    refs.step.appendChild(titleRow);
    var context = element("div", "step-context");
    var call = activeCall();
    var route = element("span", "event-route", call ? call.from.label + " → " + call.target.label : (preview ? "动作 " + labelFor(preview.actor) + " → 处理 " + labelFor(preview.handler) : "尚未执行事件"));
    route.title = route.textContent;
    context.appendChild(route);
    var event;
    if (call) {
      var callState = callStatus(call);
      event = disclosureButton(FlowAtlasPorts.kinds[call.port.kind] + " · " + call.port.label + " · " + callState.label, "current-call", "calls");
      event.classList.add("current-call", "current-call--" + callState.stage);
      event.setAttribute("data-call-stage", callState.stage);
      event.setAttribute("data-result-known", String(callState.known));
      event.setAttribute("aria-label", call.from.label + " → " + call.target.label + "." + call.port.label + " · " + callState.label);
    } else event = element("span", "step-event", beat ? beat.label : (preview && preview.event || "点击播放开始"));
    event.title = event.textContent;
    context.appendChild(event);
    refs.step.appendChild(context);
    renderDiff();
    refs.step.querySelector('[data-testid="state-diff"]').scrollLeft = diffScroll;
  }

  function renderDiff() {
    var strip = element("div", "state-diff");
    strip.setAttribute("data-testid", "state-diff");
    strip.setAttribute("data-applied", String(eventPhase() === "applied"));
    strip.setAttribute("aria-label", eventPhase() === "applied" ? "已应用的状态变化" : "待应用的状态变化");
    var changes = changesForStep();
    strip.appendChild(element("span", "state-diff__phase", eventPhase() === "applied" ? "已应用" : "待应用"));
    if (!changes.length) strip.appendChild(element("span", "state-diff__empty", currentStep() ? "此步保留既有状态" : "—"));
    changes.forEach(function (change) {
      var button = disclosureButton("", "diff-" + change.kind + "-" + change.id, "changes");
      button.classList.add("state-diff__item");
      button.title = change.label + "：" + change.before + " → " + change.after;
      button.setAttribute("aria-label", button.title);
      button.appendChild(element("strong", "state-diff__label", change.label));
      button.appendChild(element("span", "state-diff__before", change.before));
      button.appendChild(element("span", "state-diff__arrow", "→"));
      button.appendChild(element("span", "state-diff__after", change.after));
      strip.appendChild(button);
    });
    refs.step.appendChild(strip);
  }

  function renderFacts() {
    var folded = visibleState();
    var changes = changesForStep();
    refs.facts.replaceChildren();
    Object.keys(factLabels).forEach(function (key) {
      var changed = changes.some(function (change) { return change.kind === "fact" && change.id === key; });
      var card = disclosureButton("", "fact-" + key, "fact", key);
      card.className = "fact-card" + (changed ? " is-changed" : "");
      card.setAttribute("data-changed", String(changed));
      card.title = factLabels[key] + "：" + (folded.facts[key] || "未提供");
      card.appendChild(element("div", "fact-label", factLabels[key]));
      card.appendChild(element("div", "fact-value", folded.facts[key] || "未提供"));
      refs.facts.appendChild(card);
    });
    refs.facts.style.setProperty("--fact-count", Object.keys(factLabels).length);
    refs.facts.setAttribute("data-phase", eventPhase());
  }

  function render() {
    var focusedId = document.activeElement && document.activeElement.getAttribute("data-testid");
    var currentMode = mode();
    var currentScenario = scenario();
    refs.title.textContent = model.title || "流程全景图";
    refs.scope.textContent = model.scope || "源码行为模型";
    setOptions(refs.mode, array(model.modes), state.modeId, "选择运行方式");
    setOptions(refs.scenario, modeScenarios(state.modeId), state.scenarioId, "选择行为场景");
    refs.mapSummary.textContent = (currentMode && currentMode.label || "运行方式") + " · " + (currentScenario && currentScenario.label || "行为场景");
    refs.sourceSummary.textContent = array(model.sources).length + " 条来源 · " + array(model.nodes).length + " 个对象 · " + array(model.edges).length + " 条通道";
    renderMap();
    renderInspector();
    renderStep();
    renderFacts();
    updatePlayButton();
    if (focusedId && (!document.activeElement || document.activeElement === document.body)) {
      var focused = document.querySelector('[data-testid="' + focusedId + '"]');
      if (focused) focused.focus({ preventScroll: true });
    }
  }

  function selectPort(id, opener) {
    var item = capability(id);
    if (!item) return;
    state.selectedPortId = id;
    state.selectedNodeId = item.nodeId;
    state.selectedModuleId = null;
    state.selectedEdgeId = null;
    writeHash();
    openDisclosure("port", id, opener || document.activeElement);
    renderMap();
  }

  function selectNode(id) {
    if (!node(id)) return;
    state.selectedNodeId = id;
    state.selectedModuleId = null;
    state.selectedEdgeId = null;
    state.selectedPortId = null;
    writeHash();
    openDisclosure("object", null, document.activeElement);
    render();
  }

  function selectModule(nodeId, moduleId) {
    var currentNode = node(nodeId);
    if (!currentNode || !array(currentNode.modules).some(function (item) { return item.id === moduleId; })) return;
    state.selectedNodeId = nodeId;
    state.selectedModuleId = moduleId;
    state.selectedEdgeId = null;
    writeHash();
    openDisclosure("object", null, document.activeElement);
    render();
  }

  function selectEdge(id) {
    if (!edge(id)) return;
    state.selectedEdgeId = id;
    state.selectedModuleId = null;
    writeHash();
    openDisclosure("object", null, document.activeElement);
    render();
  }

  function onMapClick(event) {
    if (layoutUI && layoutUI.click(event)) return;
    var factTarget = event.target.closest ? event.target.closest("[data-fact-id]") : null;
    if (factTarget) { openDisclosure("fact", factTarget.getAttribute("data-fact-id"), factTarget); return; }
    var portTarget = event.target.closest ? event.target.closest("[data-port-id]") : null;
    if (portTarget) { selectPort(portTarget.getAttribute("data-port-id"), portTarget); return; }
    var portsTarget = event.target.closest ? event.target.closest("[data-node-ports]") : null;
    if (portsTarget) { selectNode(portsTarget.getAttribute("data-node-ports")); return; }
    var stepTarget = event.target.closest ? event.target.closest("[data-step-index]") : null;
    if (stepTarget) { setStep(Number(stepTarget.getAttribute("data-step-index")), false, true, false); return; }
    var moduleTarget = event.target.closest ? event.target.closest("[data-module-id]") : null;
    if (moduleTarget) { selectModule(moduleTarget.getAttribute("data-node-id"), moduleTarget.getAttribute("data-module-id")); return; }
    var edgeTarget = event.target.closest ? event.target.closest("[data-edge-id]") : null;
    if (edgeTarget) { selectEdge(edgeTarget.getAttribute("data-edge-id")); return; }
    var nodeTarget = event.target.closest ? event.target.closest("[data-node-id]") : null;
    if (nodeTarget) selectNode(nodeTarget.getAttribute("data-node-id"));
  }

  function onMapKeydown(event) {
    if (layoutUI && layoutUI.keydown(event)) return;
    if (event.key !== "Enter" && event.key !== " ") return;
    var target = event.target;
    if (target.hasAttribute("data-layout-handle")) { event.preventDefault(); selectNode(target.getAttribute("data-layout-handle")); return; }
    if (target.hasAttribute("data-fact-id")) { event.preventDefault(); openDisclosure("fact", target.getAttribute("data-fact-id"), target); return; }
    if (target.hasAttribute("data-port-id")) { event.preventDefault(); selectPort(target.getAttribute("data-port-id"), target); return; }
    if (target.hasAttribute("data-node-ports")) { event.preventDefault(); selectNode(target.getAttribute("data-node-ports")); return; }
    if (target.hasAttribute("data-step-index")) { event.preventDefault(); setStep(Number(target.getAttribute("data-step-index")), false, true, false); return; }
    if (target.getAttribute("data-module-id")) selectModule(target.getAttribute("data-node-id"), target.getAttribute("data-module-id"));
    else if (target.getAttribute("data-edge-id")) selectEdge(target.getAttribute("data-edge-id"));
    else if (target.getAttribute("data-node-id")) selectNode(target.getAttribute("data-node-id"));
    if (target.getAttribute("data-node-id") || target.getAttribute("data-edge-id")) event.preventDefault();
  }

  // Reuse the template's inspector locally; its hidden state never consumes map
  // width. Nonmodal disclosure preserves map, playback and keyboard access.
  function setupWorkspace() {
    refs.inspectorPanel = document.getElementById("inspector");
    refs.inspectorHeading = document.getElementById("inspector-heading");
    refs.inspectorPanel.hidden = true;
    refs.inspectorPanel.setAttribute("role", "region");
    refs.inspectorPanel.tabIndex = -1;
    refs.closeDetail = element("button", "icon-button inspector-close", "×");
    refs.closeDetail.type = "button";
    refs.closeDetail.setAttribute("aria-label", "关闭详情");
    refs.closeDetail.setAttribute("data-testid", "detail-close");
    refs.closeDetail.addEventListener("click", function () { closeDisclosure(true); });
    refs.inspectorContext.parentNode.appendChild(refs.closeDetail);
    refs.detailToggle = element("button", "disclosure-button", "ⓘ 对象");
    refs.detailToggle.type = "button";
    refs.detailToggle.setAttribute("data-testid", "detail-toggle");
    refs.detailToggle.setAttribute("aria-controls", "inspector");
    refs.detailToggle.setAttribute("data-disclosure-kind", "object");
    refs.detailToggle.addEventListener("click", function () {
      if (disclosure.open && disclosure.kind === "object") closeDisclosure(true);
      else openDisclosure("object", null, refs.detailToggle);
    });
    refs.mapSummary.parentNode.appendChild(refs.detailToggle);
    refs.scope.classList.add("sr-only");
    document.querySelector(".atlas-heading").setAttribute("title", model.scope || "源码行为模型；非实时监控");
    document.querySelector(".facts-badge").textContent = "点击展开";
    document.querySelector(".map-meta__hint").classList.add("sr-only");
    document.getElementById("step-heading").textContent = "当前事件";
  }

  function openDisclosure(kind, key, opener) {
    disclosure.kind = kind;
    disclosure.key = key || null;
    disclosure.open = true;
    if (opener && opener !== document.body) {
      disclosure.opener = { element: opener, testId: opener.getAttribute("data-testid") };
    }
    renderInspector();
    // Explicit selection starts at the contract heading; phase refreshes retain scroll.
    refs.inspector.scrollTop = 0;
    refs.closeDetail.focus({ preventScroll: true });
  }

  function updateDisclosureControls() {
    document.querySelectorAll('[aria-controls="inspector"]').forEach(function (control) {
      var expanded = disclosure.open && control.getAttribute("data-disclosure-kind") === disclosure.kind &&
        (control.getAttribute("data-disclosure-key") || "") === (disclosure.key || "");
      control.setAttribute("aria-expanded", String(expanded));
    });
  }

  function closeDisclosure(restoreFocus) {
    disclosure.open = false;
    if (!refs.inspectorPanel) return;
    refs.inspectorPanel.hidden = true;
    updateDisclosureControls();
    if (restoreFocus) {
      var target = disclosure.opener && disclosure.opener.element;
      if (target && !target.isConnected && disclosure.opener.testId) {
        target = document.querySelector('[data-testid="' + disclosure.opener.testId + '"]');
      }
      (target && target.isConnected ? target : refs.detailToggle).focus({ preventScroll: true });
    }
  }

  function bind() {
    refs.views.addEventListener("click", function (event) { var target = event.target.closest("[data-view]"); if (target) setView(target.getAttribute("data-view")); });
    refs.speed.addEventListener("change", function () { setSpeed(Number(refs.speed.value)); });
    refs.mode.addEventListener("change", function () { setMode(refs.mode.value); });
    refs.scenario.addEventListener("change", function () { setScenario(refs.scenario.value); });
    refs.previous.addEventListener("click", function () { setStep(state.stepIndex - 1, false); });
    refs.next.addEventListener("click", function () { setStep(state.stepIndex + 1, false, true, false); });
    refs.reset.addEventListener("click", function () { setStep(-1, false); });
    refs.play.addEventListener("click", togglePlayback);
    refs.map.addEventListener("scroll", updateSequenceHeader, { passive: true });
    refs.map.addEventListener("click", onMapClick);
    refs.map.addEventListener("keydown", onMapKeydown);
    window.addEventListener("resize", function () { if (layoutUI) layoutUI.cancel(false); renderMap(); });
    window.addEventListener("hashchange", function () { closeDisclosure(false); readHash(); render(); });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && disclosure.open) { event.preventDefault(); closeDisclosure(true); }
    });
    document.addEventListener("pointerdown", function (event) {
      if (!disclosure.open || refs.inspectorPanel.contains(event.target)) return;
      if (event.target.closest("[aria-controls='inspector'], #atlas-map")) return;
      closeDisclosure(false);
    });
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && state.playing) pausePlayback();
    });
    motionPreference.addEventListener("change", function () { updateFlowMarker(); });
  }

  function showModelError() {
    if (array(model.modes).length) return;
    refs.map.replaceChildren(element("div", "atlas-map__empty", "源模型尚未提供可展示的运行方式。"));
    refs.inspector.replaceChildren(element("div", "inspector-empty", "无法读取 atlas model。"));
  }

  setupWorkspace();
  readHash();
  layoutUI = FlowAtlasLayoutUI.create({
    model: model, map: refs.map, container: refs.mapSummary.parentNode,
    context: function () { return { view: state.view, modeId: state.modeId, scenarioId: state.scenarioId, selectedNodeId: state.selectedNodeId }; },
    label: labelFor, pause: pausePlayback, changed: renderMap,
    select: function (id) {
      if (state.selectedNodeId !== id) {
        state.selectedNodeId = id;
        state.selectedModuleId = null; state.selectedEdgeId = null; state.selectedPortId = null;
        if (disclosure.open) { disclosure.kind = "object"; disclosure.key = null; renderInspector(); }
      }
      writeHash();
    }
  });
  viewport = FlowAtlasViewport.create({ host: refs.map, controls: refs.map.parentNode, beforeNavigate: function () { if (layoutUI) layoutUI.cancel(); } });
  bind();
  render();
  showModelError();
}());
</script>
  </body>
</html>
