name: Native Web build dependencies
description: Install the locked SDK and browser dependencies required by build.rs
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.23.3
        cache: npm
        cache-dependency-path: |
          package-lock.json
          packages/agentx-client/package-lock.json
          web/inspector/package-lock.json
    - shell: bash
      run: |
        npm ci --prefix packages/agentx-client
        npm ci
        npm ci --prefix web/inspector
