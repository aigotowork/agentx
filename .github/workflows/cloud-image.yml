name: Cloud daemon image
on:
  pull_request:
    paths: ["src/**", "web/**", "packages/agentx-client/**", "deploy/**", "Cargo.*", "build.rs", "rust-toolchain.toml", "package*.json", "justfile", ".github/actions/native-web/**", ".github/workflows/cloud-image.yml"]
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional existing GitHub Release tag whose Linux image archive should be verified and published
        required: false
        type: string
env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
      - uses: ./.github/actions/native-web
        if: inputs.release_tag == ''
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        if: inputs.release_tag == ''
      - run: cargo build --locked --release --bin agentx
        if: inputs.release_tag == ''
      - run: npm test --prefix packages/agentx-client
        if: inputs.release_tag == ''
      - name: Exercise Namespace Space HTTP and browser operations
        if: inputs.release_tag == ''
        run: |
          python3 tests/cloud_scope/acceptance.py --suite space --candidate target/release/agentx --evidence "$RUNNER_TEMP/cloud-space-http"
          node web/agent-space/build.mjs "$RUNNER_TEMP/cloud-space-web"
          node web/agent-space/tests/cloud-space.browser.mjs "$RUNNER_TEMP/cloud-space-web"
      - run: bash deploy/build-image.sh
        if: inputs.release_tag == ''
      - name: Load the published release archive
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          cd "$RUNNER_TEMP"
          archive=agentx-cloud-linux-amd64.tar.gz
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p "$archive" -p SHA256SUMS
          awk -v file="$archive" '$2 == file {print; found++} END {exit found != 1}' SHA256SUMS | sha256sum -c -
          docker load -i "$archive"
      # The first tag checked in its SDK documents before adopting the public license.
      # Restore exactly those two documentation fields from the tagged Cargo manifest.
      - name: Reconcile v0.7.31 historical OpenAPI license
        if: inputs.release_tag == 'v0.7.31'
        run: |
          python3 - <<'PYTHON'
          import json, pathlib, tomllib
          license_id = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["package"]["license"]
          for api in ("admin", "scope"):
              path = pathlib.Path(f"packages/agentx-client/cloud-{api}.openapi.json")
              doc = json.loads(path.read_text())
              assert doc["info"]["license"] == {"identifier": "MIT", "name": "MIT"}
              doc["info"]["license"] = {"identifier": license_id, "name": license_id}
              path.write_text(json.dumps(doc))
          PYTHON
      - run: bash deploy/smoke.sh
      - if: github.event_name != 'pull_request'
        env:
          EXISTING_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push || -n "$EXISTING_TAG" ]]; then
            test "v$(docker run --rm --network none agentx-cloud:local --version | awk '{print $2}')" = "$RELEASE_TAG"
          fi
          docker save agentx-cloud:local | gzip > "$RUNNER_TEMP/cloud-image.tar.gz"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloud-image
          path: ${{ runner.temp }}/cloud-image.tar.gz
          retention-days: 1
  publish:
    needs: image
    if: github.event_name == 'push' || (inputs.release_tag != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cloud-image
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i cloud-image.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}-cloud:$RELEASE_TAG"
          docker tag agentx-cloud:local "$image"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          echo "Published \`$image\` (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
