name: Cloud daemon image
on:
  pull_request:
    paths: ["src/**", "web/**", "packages/agentx-client/**", "deploy/**", "Cargo.*", "build.rs", "rust-toolchain.toml", "package*.json", "justfile", ".github/actions/native-web/**", ".github/workflows/cloud-image.yml"]
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/native-web
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo build --locked --release --bin agentx
      - run: npm test --prefix packages/agentx-client
      - run: bash deploy/build-image.sh
      - run: bash deploy/smoke.sh
      - if: github.event_name == 'push'
        run: |
          test "v$(target/release/agentx --version | awk '{print $2}')" = "$GITHUB_REF_NAME"
          docker save agentx-cloud:local | gzip > "$RUNNER_TEMP/cloud-image.tar.gz"
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cloud-image
          path: ${{ runner.temp }}/cloud-image.tar.gz
          retention-days: 1
  publish:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: cloud-image
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker load -i cloud-image.tar.gz
          image="ghcr.io/${GITHUB_REPOSITORY,,}-cloud:$GITHUB_REF_NAME"
          docker tag agentx-cloud:local "$image"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "$image"
          echo "Published \`$image\` (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
